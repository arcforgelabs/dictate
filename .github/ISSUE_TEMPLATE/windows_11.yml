name: Windows 11 issue
description: Track a Windows 11 compatibility or packaging issue.
title: "[Windows 11] "
labels: ["platform:windows"]
body:
  - type: input
    id: version
    attributes:
      label: Dictate version
      placeholder: "2026.5.18"
  - type: input
    id: windows_build
    attributes:
      label: Windows version/build
      placeholder: "Windows 11 23H2, build 22631"
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include output from `%LOCALAPPDATA%\dictate\logs\latest.log` when available. Remove API keys, personal hotwords, private names, and sensitive dictation text before posting.
