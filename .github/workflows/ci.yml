name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[x11]"

      - name: Install package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install-windows.ps1 -NoPrepareTurbo -NoVerify -NoShortcut

      - name: Run unit tests on Linux
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests

      - name: Run unit tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests

      - name: Show version on Linux
        if: runner.os == 'Linux'
        run: dictate --version

      - name: Show version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\dictate.exe --version
