name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v20*"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          # pillow: pure wheel, powers the icon-centering guard (test_brand_icon).
          python -m pip install -e ".[x11]" pillow

      - name: Install package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install-windows.ps1 -NoPrepareTurbo -NoVerify -NoShortcut

      - name: Compile Python sources on Linux
        if: runner.os == 'Linux'
        run: python -m compileall src tests scripts

      - name: Compile Python sources on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m compileall src tests scripts

      - name: Run unit tests on Linux
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests

      - name: Run cloud sync integration tests on Linux
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s tests -p "test_sync.py"
          python -m unittest discover -s tests -p "test_sync_engine.py"
          python -m unittest discover -s tests -p "test_pro_server.py"
          python -m unittest discover -s tests -p "test_ui_server.py"

      - name: Run unit tests on Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          PYTHONFAULTHANDLER: "1"
        run: .venv\Scripts\python.exe scripts\ci_test_runner.py

      - name: Run cloud sync integration tests on Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          .venv\Scripts\python.exe -m unittest discover -s tests -p "test_sync.py"
          .venv\Scripts\python.exe -m unittest discover -s tests -p "test_sync_engine.py"
          .venv\Scripts\python.exe -m unittest discover -s tests -p "test_pro_server.py"
          .venv\Scripts\python.exe -m unittest discover -s tests -p "test_ui_server.py"

      - name: Show version on Linux
        if: runner.os == 'Linux'
        run: dictate --version

      - name: Show version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\dictate.exe --version

  windows-user-smoke:
    name: Windows user install smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Run Windows user install/update/uninstall smoke
        shell: pwsh
        run: .\scripts\windows-user-smoke.ps1 -InstallRoot "$env:RUNNER_TEMP\DictateUserSmoke"

  npm:
    name: npm package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Validate npm package contents
        run: npm pack --dry-run

  ui:
    name: Quiet Console UI (build, test, server smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install and test the UI front-end
        working-directory: ui
        run: |
          npm ci || npm install
          npm run test
          npm run build

      - name: UI control server end-to-end smoke
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[x11]"
          ./scripts/ui-server-smoke.sh "$(command -v python)"

  desktop-shell:
    name: Desktop shell (compile + Rust tests, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev

      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui-shell/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('ui-shell/src-tauri/Cargo.toml') }}

      - name: Build the front-end the shell embeds
        run: |
          npm --prefix ui ci || npm --prefix ui install
          npm --prefix ui run build

      - name: Stage a placeholder engine resource
        # The full PyInstaller freeze runs only in the release job; a placeholder
        # satisfies the bundle.resources glob so the config resolves at compile.
        run: |
          mkdir -p ui-shell/src-tauri/engine
          printf '#!/bin/sh\n' > ui-shell/src-tauri/engine/dictate-engine
          chmod +x ui-shell/src-tauri/engine/dictate-engine

      - name: Compile the shell and run its Rust tests
        run: |
          cargo build --release --manifest-path ui-shell/src-tauri/Cargo.toml
          cargo test --release --manifest-path ui-shell/src-tauri/Cargo.toml

  package:
    name: Package artifact check
    runs-on: ubuntu-latest
    needs: [tests, windows-user-smoke, npm, ui]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python scripts/release_check.py

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dictate-dist
          path: dist/*
