name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v20*"]

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[x11]"

      - name: Install package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install-windows.ps1 -NoPrepareTurbo -NoVerify -NoShortcut

      - name: Compile Python sources on Linux
        if: runner.os == 'Linux'
        run: python -m compileall src tests scripts

      - name: Compile Python sources on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m compileall src tests scripts

      - name: Run unit tests on Linux
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests

      - name: Run unit tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests

      - name: Show version on Linux
        if: runner.os == 'Linux'
        run: dictate --version

      - name: Show version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\dictate.exe --version

  windows-user-smoke:
    name: Windows user install smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Windows user install/update/uninstall smoke
        shell: pwsh
        run: .\scripts\windows-user-smoke.ps1 -InstallRoot "$env:RUNNER_TEMP\DictateUserSmoke"

  npm:
    name: npm package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate npm package contents
        run: npm pack --dry-run

  package:
    name: Package artifact check
    runs-on: ubuntu-latest
    needs: [tests, windows-user-smoke, npm]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python scripts/release_check.py

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dictate-dist
          path: dist/*
