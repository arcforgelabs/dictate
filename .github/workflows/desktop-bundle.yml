name: Desktop bundle (manual)

# Manual builder for the Linux desktop bundle — lets us iterate on the .deb /
# AppImage packaging (e.g. debug linuxdeploy) without cutting a release. Uploads
# whatever artifacts are produced plus the full build log. It also checks that
# no removed runtime (torch, pyannote; #140) is in the package, and times a cold
# start of the frozen engine to its first /api/state.
on:
  workflow_dispatch:
    inputs:
      bundles:
        description: "Bundle types to build (deb,appimage | deb | appimage)"
        required: false
        default: "deb,appimage"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  bundle:
    name: Build desktop bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Free runner disk space
        # The .deb stages the offline Parakeet model beside the frozen engine,
        # and tar/gzip needs a second copy; the stock image runs out mid-bundle.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install Tauri + engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev \
            python3-dev portaudio19-dev rpm

      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build the desktop bundle
        env:
          DICTATE_BUNDLES: ${{ inputs.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          ARCH: "x86_64"
        run: |
          set -o pipefail
          ./scripts/build-linux-desktop.sh 2>&1 | tee /tmp/bundle.log

      - name: No torch or pyannote in the package (#140)
        run: |
          set -euo pipefail
          ENGINE_DIR="$PWD/ui-shell/src-tauri/engine"
          echo "engine resources: $(du -sh "$ENGINE_DIR" | cut -f1), $(find "$ENGINE_DIR" -type f | wc -l) files"
          # Match the packages, their dist-info and native libraries, and model
          # folders. File names alone over-match: onnx-asr ships its own
          # onnx_asr/models/pyannote.py, and ONNX Runtime and huggingface_hub
          # carry torch export helpers (_torch.py, *_torch.py) that import nothing.
          found="$(find "$ENGINE_DIR" \( \( -type d \( -name 'torch' -o -name 'torch.libs' -o -name 'torch-*' \
            -o -name 'torchaudio*' -o -name 'torchcodec*' -o -iname '*pyannote*' \) \) \
            -o -name 'libtorch*' -o -name 'libc10*' \) | head -20)"
          REMOVED_RE='/(torch|torch\.libs|torch-[^/]*|torchaudio[^/]*|torchcodec[^/]*|[^/]*pyannote[^/]*)/|/lib(torch|c10)[^/]*$'
          if [ -n "$found" ]; then
            echo "::error::torch or pyannote files in the staged engine"
            printf '%s\n' "$found"
            exit 1
          fi
          echo "staged engine: 0 torch/pyannote files"
          shopt -s nullglob
          for deb in ui-shell/src-tauri/target/release/bundle/deb/*.deb; do
            listing="$(dpkg-deb -c "$deb")"
            count="$(printf '%s\n' "$listing" | grep -ciE "$REMOVED_RE" || true)"
            echo "$(basename "$deb"): $(stat -c%s "$deb") bytes, $(printf '%s\n' "$listing" | wc -l) entries, ${count} torch/pyannote entries"
            if [ "$count" != "0" ]; then
              echo "::error::$(basename "$deb") contains torch or pyannote"
              printf '%s\n' "$listing" | grep -iE "$REMOVED_RE" | head -20
              exit 1
            fi
          done
          for image in ui-shell/src-tauri/target/release/bundle/appimage/*.AppImage; do
            echo "$(basename "$image"): $(stat -c%s "$image") bytes"
          done

      - name: Cold start of the frozen engine to its first /api/state
        run: |
          set -euo pipefail
          ENGINE="$PWD/ui-shell/src-tauri/engine/dictate-engine"
          COLD="$RUNNER_TEMP/cold-start"
          export HOME="$COLD/home" XDG_DATA_HOME="$COLD/data" XDG_CONFIG_HOME="$COLD/config"
          export DICTATE_PARAKEET_MODEL_PATH="$PWD/ui-shell/src-tauri/engine/models/parakeet-tdt-0.6b-v2-onnx"
          mkdir -p "$HOME" "$XDG_DATA_HOME/dictate/notes/note_legacymeeting" "$XDG_CONFIG_HOME/dictate"
          # An upgrade from 2026.9.27: a saved Meeting selection and one saved
          # meeting transcript. Startup must migrate the first and keep the second.
          printf 'meeting_stt_backend: parakeet-pyannote\nmeeting_stt_model: parakeet-tdt-0.6b-v2\n' \
            > "$XDG_CONFIG_HOME/dictate/config.yaml"
          printf '%s\n' '{"note_id": "note_legacymeeting", "mode": "meeting", "provider": "parakeet-pyannote", "model": "parakeet-tdt-0.6b-v2", "started_at": "2026-09-30T01:00:00+00:00", "ended_at": "2026-09-30T01:05:00+00:00", "duration_s": null, "status": "ready", "speaker_labels": true, "archived": false, "recording_id": 1, "error": null, "rev": 3, "updated_at": "2026-09-30T01:05:00+00:00"}' \
            > "$XDG_DATA_HOME/dictate/notes/note_legacymeeting/note.json"
          printf '%s\n' '{"seq": 0, "t_start": 0.0, "t_end": 1.0, "provider": "parakeet-pyannote", "model": "parakeet-tdt-0.6b-v2", "text": "hello", "speaker_id": "SPEAKER_00", "speaker_label": "Speaker 1"}' \
            > "$XDG_DATA_HOME/dictate/notes/note_legacymeeting/segments.jsonl"
          HANDSHAKE="$XDG_DATA_HOME/dictate/ui-server.json"
          sync
          echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
          start="$(date +%s%N)"
          "$ENGINE" ui-server >"$COLD/server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 1200); do [ -s "$HANDSHAKE" ] && break; sleep 0.05; done
          [ -s "$HANDSHAKE" ] || { echo "::error::no handshake after 60 s"; cat "$COLD/server.log"; exit 1; }
          handshake="$(date +%s%N)"
          URL="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['url'])" "$HANDSHAKE")"
          TOKEN="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['token'])" "$HANDSHAKE")"
          until curl -fsS -o "$COLD/state.json" -H "Authorization: Bearer $TOKEN" "$URL/api/state"; do
            sleep 0.05
          done
          state="$(date +%s%N)"
          curl -fsS -o /dev/null -w 'second /api/state: %{time_total} s\n' -H "Authorization: Bearer $TOKEN" "$URL/api/state"
          echo "spawn to handshake: $(( (handshake - start) / 1000000 )) ms"
          echo "spawn to first /api/state: $(( (state - start) / 1000000 )) ms"
          python3 - "$COLD/state.json" "$XDG_CONFIG_HOME/dictate/config.yaml" <<'EOF'
          import json, sys
          state = json.load(open(sys.argv[1]))
          config = open(sys.argv[2]).read()
          assert "meetingModel" not in state and "meetingReadiness" not in state, sorted(state)
          assert state["model"]["backend"] == "parakeet", state["model"]
          assert "meeting" not in config, config
          legacy = [item for item in state["history"] if item.get("id") == "note_legacymeeting"]
          assert legacy and legacy[0]["text"] == "Speaker 1: hello", legacy
          print("state: no meeting fields; saved Meeting settings migrated; saved meeting transcript listed:", legacy[0]["text"])
          EOF
          grep -i "meeting" "$COLD/server.log" || true

      - name: Upload artifacts (.deb / .AppImage)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-bundle
          retention-days: 14
          path: |
            ui-shell/src-tauri/target/release/bundle/deb/*.deb
            ui-shell/src-tauri/target/release/bundle/rpm/*.rpm
            ui-shell/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bundle-log
          retention-days: 7
          path: /tmp/bundle.log
          if-no-files-found: warn
