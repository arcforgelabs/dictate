name: Desktop bundle (manual)

# Manual builder for the Linux desktop bundle — lets us iterate on the .deb /
# AppImage packaging (e.g. debug linuxdeploy) without cutting a release. Uploads
# whatever artifacts are produced plus the full build log.
on:
  workflow_dispatch:
    inputs:
      bundles:
        description: "Bundle types to build (deb,appimage | deb | appimage)"
        required: false
        default: "deb,appimage"

jobs:
  bundle:
    name: Build desktop bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Tauri + engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev \
            python3-dev portaudio19-dev

      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build the desktop bundle
        env:
          DICTATE_BUNDLES: ${{ inputs.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          ARCH: "x86_64"
        run: ./scripts/build-linux-desktop.sh 2>&1 | tee /tmp/bundle.log

      - name: Upload artifacts (.deb / .AppImage)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-bundle
          path: |
            ui-shell/src-tauri/target/release/bundle/deb/*.deb
            ui-shell/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-log
          path: /tmp/bundle.log
          if-no-files-found: warn
