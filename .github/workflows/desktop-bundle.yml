name: Desktop bundle (manual)

# Manual builder for the Linux desktop bundle — lets us iterate on the .deb /
# AppImage packaging (e.g. debug linuxdeploy) without cutting a release. Uploads
# whatever artifacts are produced plus the full build log.
on:
  workflow_dispatch:
    inputs:
      bundles:
        description: "Bundle types to build (deb,appimage | deb | appimage)"
        required: false
        default: "deb,appimage"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bundle:
    name: Build desktop bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Tauri + engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev \
            python3-dev portaudio19-dev rpm

      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build the desktop bundle
        env:
          DICTATE_BUNDLES: ${{ inputs.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          ARCH: "x86_64"
        run: ./scripts/build-linux-desktop.sh 2>&1 | tee /tmp/bundle.log

      - name: Upload artifacts (.deb / .AppImage)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-bundle
          path: |
            ui-shell/src-tauri/target/release/bundle/deb/*.deb
            ui-shell/src-tauri/target/release/bundle/rpm/*.rpm
            ui-shell/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bundle-log
          path: /tmp/bundle.log
          if-no-files-found: warn
