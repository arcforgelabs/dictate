name: Dictate NPM Release
run-name: dictate npm ${{ inputs.tag }}

# Publishes the npm tarball that Dictate Release Publish proved for a tag
# (docs/RELEASING.md). Dictate Release Publish starts it with its own run
# id; it can be started again by hand with the same inputs, and skips a
# version npm already serves with the same bytes.
#
#   resolve       the tarball from that run must match its release manifest
#                 (SHA-256 and npm integrity)
#   approve       environment npm-release: Samuel approves the publish,
#                 unless this run was dispatched by an approved Dictate
#                 Release Publish run (below). A manual dispatch always
#                 waits for it.
#   publish       environment npm-publish: npm trusted publishing, no stored
#                 token, with an explicit --tag beta or --tag latest
#   evidence      verifies what npm serves, attaches
#                 postpublish-evidence.json, and makes the draft GitHub
#                 Release public
#   windows-gate  for a stable release or a correction, starts the Windows
#                 release gate (windows-release-gate.yml) on the public
#                 release
#
# A stable release has one approval: environment release, at the start of
# Dictate Release Publish. This run accepts it instead of asking again only
# when GitHub Actions itself dispatched it (github.actor is
# github-actions[bot], which no person can be; a re-run keeps it), the run it
# names is a Dictate Release Publish run from master for this tag, and, for a
# stable release or correction, GitHub's approvals record of that run shows
# environment release approved. A beta needs no approval when it was
# dispatched that way.
#
# npm's trusted publisher for @arcforgelabs/dictate names this file
# (dictate-npm-release.yml) and environment npm-publish. Renaming either
# breaks publishing until the trusted publisher is changed on npmjs.com.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2026.10.3-beta.1
        required: true
        type: string
      release_publish_run_id:
        description: The Dictate Release Publish run that proved this tag's tarball
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dictate-npm-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  # The first npm CLI that can also move dist-tags through trusted publishing.
  NPM_VERSION: "11.21.0"
  PACKAGE: "@arcforgelabs/dictate"

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      tarball: ${{ steps.release.outputs.tarball }}
      integrity: ${{ steps.release.outputs.integrity }}
      needs_approval: ${{ steps.approval.outputs.needs_approval }}
    steps:
      - name: Require the workflow from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Run Dictate NPM Release from master, not ${GITHUB_REF}." >&2
          exit 1

      - name: Fetch the proved tarball and the release manifest
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.release_publish_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v20[0-9]{2}\.([1-9]|1[0-2])\.[1-9][0-9]*(-beta\.[1-9][0-9]*|-[1-9][0-9]*)?$ ]]; then
            echo "::error::${TAG} is not a release tag (vYYYY.M.N, vYYYY.M.N-beta.B or vYYYY.M.N-C)." >&2
            exit 1
          fi
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          if [[ "$(jq -r .path <<< "$run")" != ".github/workflows/dictate-release-publish.yml" || "$(jq -r .head_branch <<< "$run")" != "master" ]]; then
            echo "::error::Run ${RUN_ID} is not a Dictate Release Publish run from master." >&2
            exit 1
          fi
          if [[ "$(jq -r .display_title <<< "$run")" != "dictate ${TAG}" ]]; then
            echo "::error::Run ${RUN_ID} published $(jq -r .display_title <<< "$run"), not dictate ${TAG}." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/package" "$RUNNER_TEMP/release"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name npm-package --dir "$RUNNER_TEMP/package"
          # The manifest comes from the same Publish run as the tarball: the
          # GitHub Release is still a draft, which this read-only token
          # cannot see.
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-manifest --dir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum -c release-manifest.json.sha256
          manifest="$RUNNER_TEMP/release/release-manifest.json"
          jq -e --arg tag "$TAG" '.tag == $tag' "$manifest" >/dev/null || { echo "::error::The manifest is not for ${TAG}." >&2; exit 1; }
          tarball="$(jq -r .npm.tarball "$manifest")"
          cd "$RUNNER_TEMP/package"
          echo "$(jq -r .npm.tarballSha256 "$manifest")  ${tarball}" | sha256sum -c -
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          if [[ "$integrity" != "$(jq -r .npm.integrity "$manifest")" ]]; then
            echo "::error::The tarball's integrity does not match the release manifest." >&2
            exit 1
          fi
          dist_tag="$(jq -r .npm.distTag "$manifest")"
          channel="$(jq -r .channel "$manifest")"
          # The dist-tag is always explicit: npm's semver order ranks a
          # correction below its final, so npm never picks the channel.
          case "${channel}:${dist_tag}" in
            beta:beta|stable:latest|correction:latest) ;;
            *) echo "::error::The manifest names channel ${channel} with npm dist-tag ${dist_tag}." >&2; exit 1 ;;
          esac
          {
            echo "version=$(jq -r .version "$manifest")"
            echo "channel=${channel}"
            echo "dist_tag=${dist_tag}"
            echo "tarball=${tarball}"
            echo "integrity=${integrity}"
          } | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      # Does this run need its own approval? Only GitHub Actions can be the
      # actor github-actions[bot] (a re-run keeps the original actor); a
      # person dispatching this workflow by hand always gets the npm-release
      # gate.
      - name: Decide whether npm-release must approve
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.release_publish_run_id }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          DISPATCHED_BY: ${{ github.actor }}
        run: |
          set -euo pipefail
          needs_approval=true
          if [[ "$DISPATCHED_BY" == "github-actions[bot]" ]]; then
            if [[ "$CHANNEL" == "beta" ]]; then
              needs_approval=false
              echo "A beta dispatched by Dictate Release Publish run ${RUN_ID}: no approval needed."
            else
              approved="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/approvals" \
                --jq '[.[] | select(.state == "approved" and any(.environments[]; .name == "release")) | .user.login] | first // ""')"
              if [[ -n "$approved" ]]; then
                needs_approval=false
                echo "Dictate Release Publish run ${RUN_ID} was approved for environment release by ${approved}: no second approval."
              else
                echo "::warning::Run ${RUN_ID} has no approval of environment release; npm-release must approve."
              fi
            fi
          else
            echo "Dispatched by ${DISPATCHED_BY}, not by Dictate Release Publish: npm-release must approve."
          fi
          echo "needs_approval=${needs_approval}" >> "$GITHUB_OUTPUT"
          echo "npm-release approval needed: ${needs_approval}" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the tarball for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package
          retention-days: 30
          if-no-files-found: error

  approve:
    name: Approve ${{ inputs.tag }} for npm ${{ needs.resolve.outputs.dist_tag }}
    needs: resolve
    if: needs.resolve.outputs.needs_approval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: npm-release
    permissions: {}
    steps:
      - name: Record the approval
        env:
          TAG: ${{ inputs.tag }}
          DIST_TAG: ${{ needs.resolve.outputs.dist_tag }}
          INTEGRITY: ${{ needs.resolve.outputs.integrity }}
        run: echo "Approved ${PACKAGE} ${TAG} for npm ${DIST_TAG} (${INTEGRITY})"

  publish:
    name: publish
    needs: [resolve, approve]
    # After its own approval, or, when resolve proved the dispatching run's
    # approval (or a beta), with that approval job skipped.
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success' && (
        needs.approve.result == 'success' ||
        (needs.resolve.outputs.needs_approval == 'false' && needs.approve.result == 'skipped')
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@arcforgelabs/dictate/v/${{ needs.resolve.outputs.version }}
    permissions:
      contents: read
      # Trusted publishing: npm exchanges GitHub's OIDC token for a
      # short-lived publish token. Do not set NODE_AUTH_TOKEN or a
      # registry-url: npm would use that instead of OIDC.
      id-token: write
    steps:
      - name: Fetch the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm ${{ env.NPM_VERSION }}
        run: npm install -g "npm@${NPM_VERSION}" && npm --version

      # Idempotent, so a rerun is safe: a version npm already serves with the
      # manifest's integrity is not published again, and npm's "already
      # published" answer to a version it has not yet shown (registry lag)
      # is checked by the read-back below instead of failing here.
      - name: Publish to npm
        working-directory: package
        env:
          TARBALL: ${{ needs.resolve.outputs.tarball }}
          VERSION: ${{ needs.resolve.outputs.version }}
          DIST_TAG: ${{ needs.resolve.outputs.dist_tag }}
          INTEGRITY: ${{ needs.resolve.outputs.integrity }}
        run: |
          set -euo pipefail
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          [[ "$local_integrity" == "$INTEGRITY" ]] || { echo "::error::The tarball changed between jobs." >&2; exit 1; }
          published="$(npm view "${PACKAGE}@${VERSION}" dist.integrity 2>/dev/null || true)"
          if [[ -n "$published" ]]; then
            if [[ "$published" != "$INTEGRITY" ]]; then
              echo "::error::${PACKAGE}@${VERSION} is already on npm with different bytes (${published}). A version is never republished; cut a new tag." >&2
              exit 1
            fi
            echo "${PACKAGE}@${VERSION} is already on npm with these bytes; not publishing again."
            exit 0
          fi
          if ! npm publish "./${TARBALL}" --access public --tag "$DIST_TAG" 2> "$RUNNER_TEMP/publish.err"; then
            cat "$RUNNER_TEMP/publish.err" >&2
            if grep -qiE "cannot publish over|previously published|EPUBLISHCONFLICT" "$RUNNER_TEMP/publish.err"; then
              echo "::warning::npm says ${PACKAGE}@${VERSION} is already published; the read-back checks its bytes."
              exit 0
            fi
            exit 1
          fi

      # npm can take minutes to serve a new version everywhere: retry with
      # backoff for about 15 minutes before calling it missing.
      - name: Read back what npm serves
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          INTEGRITY: ${{ needs.resolve.outputs.integrity }}
          DIST_TAG: ${{ needs.resolve.outputs.dist_tag }}
        run: |
          set -euo pipefail
          served=""
          delay=5
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            served="$(npm view "${PACKAGE}@${VERSION}" dist.integrity --prefer-online 2>/dev/null || true)"
            [[ -n "$served" ]] && break
            echo "npm does not serve ${PACKAGE}@${VERSION} yet; retrying in ${delay}s"
            sleep "$delay"
            delay=$(( delay * 2 > 60 ? 60 : delay * 2 ))
          done
          if [[ "$served" != "$INTEGRITY" ]]; then
            echo "::error::npm serves ${served:-nothing} for ${PACKAGE}@${VERSION}; the release manifest says ${INTEGRITY}." >&2
            exit 1
          fi
          tagged="$(npm view "$PACKAGE" "dist-tags.${DIST_TAG}" --prefer-online 2>/dev/null || true)"
          if [[ "$tagged" != "$VERSION" ]]; then
            echo "::warning::npm ${DIST_TAG} points at ${tagged:-nothing}, not ${VERSION}. A rerun of an older tag does not move it back; use Dictate Release Promote."
          fi
          {
            echo "npm serves ${PACKAGE}@${VERSION} with ${served}"
            npm view "$PACKAGE" dist-tags --json
          } >> "$GITHUB_STEP_SUMMARY"

  evidence:
    name: evidence
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm ${{ env.NPM_VERSION }}
        run: npm install -g "npm@${NPM_VERSION}"

      # What anyone can check from outside: the npm registry signature of the
      # published version, and the dist-tags.
      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          INTEGRITY: ${{ needs.resolve.outputs.integrity }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          (cd "$work" && npm init -y >/dev/null)
          delay=5
          deadline=$((SECONDS + 900))
          until (cd "$work" && npm install --omit=dev --ignore-scripts --no-audit --no-fund --prefer-online "${PACKAGE}@${VERSION}" >/dev/null); do
            (( SECONDS < deadline )) || { echo "::error::${PACKAGE}@${VERSION} did not install within 15 minutes." >&2; exit 1; }
            echo "npm cannot install ${PACKAGE}@${VERSION} yet; retrying in ${delay}s"
            sleep "$delay"
            delay=$(( delay * 2 > 60 ? 60 : delay * 2 ))
          done
          (cd "$work" && npm audit signatures --json) > "$RUNNER_TEMP/npm-signatures.json" || {
            cat "$RUNNER_TEMP/npm-signatures.json" >&2; exit 1; }
          npm view "${PACKAGE}@${VERSION}" dist --json > "$RUNNER_TEMP/npm-dist.json"
          jq -e --arg integrity "$INTEGRITY" '.integrity == $integrity' "$RUNNER_TEMP/npm-dist.json" >/dev/null
          npm view "$PACKAGE" dist-tags --json > "$RUNNER_TEMP/npm-dist-tags.json"
          mkdir -p "$RUNNER_TEMP/evidence"
          jq -n \
            --arg tag "$TAG" --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile signatures "$RUNNER_TEMP/npm-signatures.json" \
            --slurpfile dist "$RUNNER_TEMP/npm-dist.json" \
            --slurpfile distTags "$RUNNER_TEMP/npm-dist-tags.json" \
            '{tag: $tag, checkedAt: $checkedAt,
              npm: {integrity: $dist[0].integrity, shasum: $dist[0].shasum, distTags: $distTags[0],
                    auditSignatures: $signatures[0]}}' \
            > "$RUNNER_TEMP/evidence/postpublish-evidence.json"
          cd "$RUNNER_TEMP/evidence"
          sha256sum postpublish-evidence.json > postpublish-evidence.json.sha256
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber postpublish-evidence.json postpublish-evidence.json.sha256
          jq . postpublish-evidence.json >> "$GITHUB_STEP_SUMMARY"

      # The GitHub Release is public as soon as npm is verified, never before:
      # Dictate Release Publish left it a draft, so a channel follower
      # (GitHub's latest release) never sees a version npm does not serve.
      - name: Make the GitHub Release public
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "beta" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            # A rerun for an older stable tag must not move GitHub's latest
            # release backwards: the app reads it first. Only Dictate Release
            # Promote rolls a channel back on purpose.
            # Only a 404 means there is no latest release. Any other failed
            # read is retried, then stops the run before the pointer moves.
            current=""
            for attempt in 1 2 3; do
              if current="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>"$RUNNER_TEMP/latest.err")"; then
                break
              fi
              current=""
              if grep -q "HTTP 404" "$RUNNER_TEMP/latest.err"; then
                break
              fi
              if (( attempt == 3 )); then
                echo "::error::Cannot read GitHub's latest release: $(cat "$RUNNER_TEMP/latest.err"). The release stays a draft; run this workflow again." >&2
                exit 1
              fi
              sleep $(( attempt * 10 ))
            done
            newest="$(printf '%s\n%s\n' "${current#v}" "${TAG#v}" | sed '/^$/d' | sort -V | tail -n 1)"
            if [[ -z "$current" || "$newest" == "${TAG#v}" ]]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            else
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
              echo "::warning::${TAG} is older than GitHub's latest release ${current}; the latest release is not moved." >&2
            fi
          fi
          echo "${TAG} is public: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

  # The Windows release gate installs the published setup.exe on the release
  # VM. It reads the public release, so it starts only after evidence. The
  # Store draft refuses to build without a pass for the same version.
  windows-gate:
    name: windows-gate
    needs: [resolve, evidence]
    if: ${{ !cancelled() && needs.evidence.result == 'success' && needs.resolve.outputs.channel != 'beta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the Windows release gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run windows-release-gate.yml --repo "$GITHUB_REPOSITORY" --ref master -f tag="$TAG"
          echo "Started the Windows release gate for ${TAG}." >> "$GITHUB_STEP_SUMMARY"
