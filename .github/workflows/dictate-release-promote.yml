name: Dictate Release Promote
run-name: Point its channel at dictate ${{ inputs.tag }}

# Points a channel at a published release (docs/RELEASING.md), after it
# verifies the release as published: the manifest's checksum and the npm
# integrity and registry signatures.
#
#   stable tag or correction  npm `latest` and GitHub's latest release;
#                             `beta` moves up too when it is behind
#   beta tag                  npm `beta`
#
# A release already lands on its channel when it is published, so this is
# for moving `beta` up after a stable release, and for rolling a channel
# back to an earlier release or putting one back. "Behind" is PEP 440 order
# (scripts/calver.py newest), never npm's semver order, which ranks a
# correction below its final.
#
# npm's trusted publisher for this file (environment npm-release) has
# "Allow npm dist-tag" on and does not publish.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v2026.10.3 or v2026.10.3-beta.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dictate-release-promote
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  # The first npm CLI that can move dist-tags through trusted publishing.
  NPM_VERSION: "11.21.0"
  PACKAGE: "@arcforgelabs/dictate"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      channel: ${{ steps.manifest.outputs.channel }}
    steps:
      - name: Require the workflow from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Run Dictate Release Promote from master, not ${GITHUB_REF}." >&2
          exit 1

      - name: Read and check the release manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v20[0-9]{2}\.([1-9]|1[0-2])\.[1-9][0-9]*(-beta\.[1-9][0-9]*|-[1-9][0-9]*)?$ ]]; then
            echo "::error::${TAG} is not a release tag (vYYYY.M.N, vYYYY.M.N-beta.B or vYYYY.M.N-C)." >&2
            exit 1
          fi
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "::error::${TAG} is not a published GitHub Release. Finish Dictate NPM Release first." >&2
            exit 1
          fi
          cd "$RUNNER_TEMP"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'release-manifest.json*'
          sha256sum -c release-manifest.json.sha256
          jq -e --arg tag "$TAG" '.tag == $tag' release-manifest.json >/dev/null
          {
            echo "version=$(jq -r .version release-manifest.json)"
            echo "channel=$(jq -r .channel release-manifest.json)"
            echo "integrity=$(jq -r .npm.integrity release-manifest.json)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm ${{ env.NPM_VERSION }}
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Verify the npm package
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          INTEGRITY: ${{ steps.manifest.outputs.integrity }}
        run: |
          set -euo pipefail
          served="$(npm view "${PACKAGE}@${VERSION}" dist.integrity)"
          if [[ "$served" != "$INTEGRITY" ]]; then
            echo "::error::npm serves ${served} for ${PACKAGE}@${VERSION}; the manifest says ${INTEGRITY}." >&2
            exit 1
          fi
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install --omit=dev --ignore-scripts --no-audit --no-fund "${PACKAGE}@${VERSION}" >/dev/null
          npm audit signatures

  promote:
    name: promote
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm-release
      url: https://github.com/arcforgelabs/dictate/releases/tag/${{ inputs.tag }}
    permissions:
      contents: write
      # npm dist-tag through trusted publishing (npm 11.21.0 or later, with
      # "Allow npm dist-tag" on this workflow's trusted publisher).
      id-token: write
    steps:
      # master's release tooling, for the PEP 440 comparison. Nothing is
      # built from it.
      - name: Check out master's release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm ${{ env.NPM_VERSION }}
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Move the npm dist-tags
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "beta" ]]; then
            npm dist-tag add "${PACKAGE}@${VERSION}" beta
            npm view "$PACKAGE" dist-tags --json | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm dist-tag add "${PACKAGE}@${VERSION}" latest
          # Beta users are never behind stable: when `beta` is missing, or older
          # than this release in PEP 440 order, it moves up to this release.
          beta="$(npm view "$PACKAGE" dist-tags.beta 2>/dev/null || true)"
          if [[ "$beta" == "$VERSION" ]]; then
            echo "npm beta is already ${VERSION}."
          elif [[ -z "$beta" || "$(python scripts/calver.py newest "$beta" "$VERSION")" == "$VERSION" ]]; then
            npm dist-tag add "${PACKAGE}@${VERSION}" beta
            echo "Moved npm beta from ${beta:-nothing} to ${VERSION}."
          else
            echo "npm beta (${beta}) is newer than ${VERSION}; it stays."
          fi
          npm view "$PACKAGE" dist-tags --json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Mark the GitHub Release as latest
        if: needs.verify.outputs.channel != 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
