name: Microsoft Store API smoke

# Verifies that the Partner Center app credentials are wired into GitHub Actions.
# This workflow is read-only by default. It obtains tokens and can query the
# reserved Dictate MSIX/PWA product through the legacy Store services API.
on:
  workflow_dispatch:
    inputs:
      product_id:
        description: "Partner Center product ID. Optional for auth-only smoke."
        required: false
        default: "9P5S7747V0BP"
      query:
        description: "Read-only query to run when product_id is set."
        required: false
        default: "legacy-app"
        type: choice
        options:
          - legacy-app
          - legacy-apps
          - status
          - metadata

jobs:
  smoke:
    name: Store API smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check Microsoft Store API credentials
        env:
          MSSTORE_TENANT_ID: ${{ vars.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ vars.MSSTORE_CLIENT_ID }}
          MSSTORE_SELLER_ID: ${{ vars.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_PRODUCT_ID: ${{ inputs.product_id }}
        run: |
          python scripts/msstore-submit.py auth-check
          python scripts/msstore-submit.py legacy-auth-check
          if [ -n "$MSSTORE_PRODUCT_ID" ]; then
            python scripts/msstore-submit.py "${{ inputs.query }}"
          fi
