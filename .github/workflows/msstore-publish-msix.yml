name: Microsoft Store MSIX publish (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "draft uploads a package without committing; publish commits the current draft; status only checks state"
        required: true
        default: "status"
        type: choice
        options:
          - status
          - draft
          - publish
      product_id:
        description: "Partner Center product ID"
        required: true
        default: "9P5S7747V0BP"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  msstore:
    name: Microsoft Store MSIX ${{ inputs.mode }}
    runs-on: windows-latest
    environment:
      name: ${{ inputs.mode == 'publish' && 'microsoft-store-publish' || inputs.mode == 'draft' && 'microsoft-store-draft' || 'microsoft-store-status' }}
    env:
      MSSTORE_PRODUCT_ID: ${{ inputs.product_id }}
      MSSTORE_TENANT_ID: ${{ vars.MSSTORE_TENANT_ID }}
      MSSTORE_CLIENT_ID: ${{ vars.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      MSSTORE_SELLER_ID: ${{ vars.MSSTORE_SELLER_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Require default branch workflow
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "${{ github.event.repository.default_branch }}") {
            throw "Run this workflow from ${{ github.event.repository.default_branch }}, not ${{ github.ref_name }}."
          }

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: inputs.mode == 'draft'
        with:
          node-version: "24"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Check Microsoft Store credentials
        shell: pwsh
        run: |
          foreach ($name in "MSSTORE_TENANT_ID", "MSSTORE_CLIENT_ID", "MSSTORE_CLIENT_SECRET", "MSSTORE_SELLER_ID", "MSSTORE_PRODUCT_ID") {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Missing $name"
            }
          }
          python scripts/msstore-submit.py legacy-auth-check
          python scripts/msstore-submit.py legacy-app

      - name: Install Microsoft Store Developer CLI
        shell: pwsh
        run: |
          winget install Microsoft.DotNet.DesktopRuntime.9 --silent --accept-package-agreements --accept-source-agreements
          winget install "Microsoft Store Developer CLI" --silent --accept-package-agreements --accept-source-agreements
          $paths = @(
            "$env:LOCALAPPDATA\Microsoft\WinGet\Links",
            "$env:ProgramFiles\Microsoft Store Developer CLI",
            "$env:ProgramFiles\msstore"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Add-Content -Path $env:GITHUB_PATH -Value $path
            }
          }

      - name: Configure Microsoft Store Developer CLI
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "$env:MSSTORE_TENANT_ID" `
            --sellerId "$env:MSSTORE_SELLER_ID" `
            --clientId "$env:MSSTORE_CLIENT_ID" `
            --clientSecret "$env:MSSTORE_CLIENT_SECRET"

      - name: Show current Store submission status
        shell: pwsh
        run: msstore submission status "$env:MSSTORE_PRODUCT_ID"

      - name: Build Store MSIX
        if: inputs.mode == 'draft'
        shell: pwsh
        env:
          DICTATE_HF_TOKEN: ${{ secrets.DICTATE_HF_TOKEN }}
        run: .\scripts\build-windows-msix-store.ps1 -Python "${{ env.pythonLocation }}\python.exe"

      - name: Upload package to draft without committing
        if: inputs.mode == 'draft'
        shell: pwsh
        run: |
          $msix = Get-ChildItem "packaging\msix\out" -Filter "*.msix" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) {
            throw "No MSIX package was produced."
          }
          # Pass the .msix itself as the project path. With no path the CLI
          # inspects the working directory, finds package.json, treats the repo
          # as an Electron app, and uploads without attaching the package, so
          # the Store re-publishes the previous package and still says success.
          msstore publish "$($msix.FullName)" --appId "$env:MSSTORE_PRODUCT_ID" --noCommit
          if ($LASTEXITCODE -ne 0) {
            throw "msstore publish failed with exit code $LASTEXITCODE"
          }
          $submission = (msstore submission get "$env:MSSTORE_PRODUCT_ID" | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "msstore submission get failed with exit code $LASTEXITCODE"
          }
          if ($submission -notmatch [regex]::Escape($msix.Name)) {
            Write-Output $submission
            throw "The draft does not contain $($msix.Name); the Store would re-publish the previous package."
          }
          Write-Output "Draft contains $($msix.Name)"
          msstore submission status "$env:MSSTORE_PRODUCT_ID"
          if ($LASTEXITCODE -ne 0) {
            throw "msstore submission status failed with exit code $LASTEXITCODE"
          }

      - name: Commit current Store draft
        if: inputs.mode == 'publish'
        shell: pwsh
        run: |
          msstore submission publish "$env:MSSTORE_PRODUCT_ID"
          if ($LASTEXITCODE -ne 0) {
            throw "msstore submission publish failed with exit code $LASTEXITCODE"
          }
          msstore submission poll "$env:MSSTORE_PRODUCT_ID"
