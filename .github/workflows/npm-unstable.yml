name: npm unstable publish

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or SHA to publish as an unstable npm shim"
        required: false
        default: ""
      npm_tag:
        description: "npm dist-tag to update"
        required: true
        default: "unstable"
      run_tests:
        description: "Run Python and npm package checks before publishing"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  id-token: write

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    if: inputs.run_tests == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[x11]"

      - name: Install package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install-windows.ps1 -NoPrepareTurbo -NoVerify -NoShortcut

      - name: Compile Python sources on Linux
        if: runner.os == 'Linux'
        run: python -m compileall src tests scripts

      - name: Compile Python sources on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m compileall src tests scripts

      - name: Run unit tests on Linux
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests

      - name: Run UI server integration tests on Linux
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s tests -p "test_ui_server.py"

      - name: Run unit tests on Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          PYTHONFAULTHANDLER: "1"
        run: .venv\Scripts\python.exe scripts\ci_test_runner.py

      - name: Run UI server integration tests on Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          .venv\Scripts\python.exe -m unittest discover -s tests -p "test_ui_server.py"

      - name: Show version on Linux
        if: runner.os == 'Linux'
        run: dictate --version

      - name: Show version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\dictate.exe --version

  windows-user-smoke:
    name: Windows user install smoke
    if: inputs.run_tests == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Run Windows user install/update/uninstall smoke
        shell: pwsh
        run: .\scripts\windows-user-smoke.ps1 -InstallRoot "$env:RUNNER_TEMP\DictateUserSmoke"

  ui:
    name: Quiet Console UI (build, test, server smoke)
    if: inputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install and test the UI front-end
        working-directory: ui
        run: |
          npm ci || npm install
          npm run test
          npm run build

      - name: UI control server end-to-end smoke
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[x11]"
          ./scripts/ui-server-smoke.sh "$(command -v python)"

  desktop-shell:
    name: Desktop shell (compile + Rust tests, Linux)
    if: inputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev

      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui-shell/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('ui-shell/src-tauri/Cargo.toml') }}

      - name: Build the front-end the shell embeds
        run: |
          npm --prefix ui ci || npm --prefix ui install
          npm --prefix ui run build

      - name: Stage a placeholder engine resource
        run: |
          mkdir -p ui-shell/src-tauri/engine
          printf '#!/bin/sh\n' > ui-shell/src-tauri/engine/dictate-engine
          chmod +x ui-shell/src-tauri/engine/dictate-engine

      - name: Compile the shell and run its Rust tests
        run: |
          cargo build --release --manifest-path ui-shell/src-tauri/Cargo.toml
          cargo test --release --manifest-path ui-shell/src-tauri/Cargo.toml

  windows-desktop-bundle:
    name: Windows desktop prebuild (.msi + setup .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup default stable

      - name: Install Windows bundling dependencies
        shell: pwsh
        run: choco install wixtoolset nsis -y --no-progress

      - name: Build Windows desktop installers
        shell: pwsh
        env:
          DICTATE_BUNDLES: "msi,nsis"
          DICTATE_HF_TOKEN: ${{ secrets.DICTATE_HF_TOKEN }}
        run: |
          $base = node -p "require('./package.json').version"
          $env:DICTATE_PACKAGE_VERSION = "$base-${{ inputs.npm_tag }}.${{ github.run_number }}.${{ github.run_attempt }}"
          .\scripts\build-windows-desktop.ps1 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\windows-desktop-prebuild.log"

      - name: Publish durable unstable Windows installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = node -p "require('./package.json').version"
          $version = "$base-${{ inputs.npm_tag }}.${{ github.run_number }}.${{ github.run_attempt }}"
          $tag = "v$version"
          $sha = git rev-parse HEAD
          $artifacts = Get-ChildItem "ui-shell\src-tauri\target\release\bundle" -Recurse -File |
            Where-Object { $_.Extension -in ".msi", ".exe" } |
            Select-Object -ExpandProperty FullName
          if (-not $artifacts) { throw "No Windows installers were produced." }
          if (gh release view $tag 2>$null) {
            gh release upload $tag $artifacts --clobber
          } else {
            gh release create $tag $artifacts --target $sha --prerelease --title "Dictate $version" --notes "Unstable direct-download build. Unsigned Windows installer."
          }

      - name: Upload Windows prebuild log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-desktop-prebuild-log-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 7
          path: ${{ runner.temp }}\windows-desktop-prebuild.log
          if-no-files-found: warn

  linux-desktop-bundle:
    name: Linux desktop prebuild (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Tauri + engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev \
            python3-dev portaudio19-dev

      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Linux desktop .deb
        env:
          DICTATE_BUNDLES: "deb"
          DICTATE_HF_TOKEN: ${{ secrets.DICTATE_HF_TOKEN }}
        run: |
          set -euo pipefail
          BASE="$(node -p "require('./package.json').version")"
          export DICTATE_PACKAGE_VERSION="${BASE}-${{ inputs.npm_tag }}.${{ github.run_number }}.${{ github.run_attempt }}"
          ./scripts/build-linux-desktop.sh 2>&1 | tee /tmp/linux-desktop-prebuild.log

      - name: Publish durable unstable Linux .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="$(node -p "require('./package.json').version")"
          VERSION="${BASE}-${{ inputs.npm_tag }}.${{ github.run_number }}.${{ github.run_attempt }}"
          TAG="v${VERSION}"
          SHA="$(git rev-parse HEAD)"
          mapfile -t ARTIFACTS < <(find ui-shell/src-tauri/target/release/bundle -type f -name '*.deb')
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "No Linux .deb was produced." >&2
            exit 1
          fi
          for artifact in "${ARTIFACTS[@]}"; do
            size="$(stat -c%s "$artifact")"
            echo "$artifact ($size bytes)"
            # GitHub release assets must be < 2 GiB.
            if [ "$size" -ge 2147483648 ]; then
              echo "✗ $artifact is ${size} bytes (>= 2 GiB); refuse upload." >&2
              echo "  Linux packaging must use CPU torch and exclude nvidia/triton." >&2
              exit 1
            fi
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ARTIFACTS[@]}" --clobber
          else
            gh release create "$TAG" "${ARTIFACTS[@]}" \
              --target "$SHA" \
              --prerelease \
              --title "Dictate $VERSION" \
              --notes "Unstable direct-download build for Linux (.deb) and Windows. Uses distro PortAudio on Linux."
          fi

      - name: Upload Linux prebuild log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: linux-desktop-prebuild-log-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 7
          path: /tmp/linux-desktop-prebuild.log
          if-no-files-found: warn

  publish:
    name: Publish npm unstable shim
    runs-on: ubuntu-latest
    needs: [tests, windows-user-smoke, ui, desktop-shell, windows-desktop-bundle, linux-desktop-bundle]
    if: >-
      ${{
        always() &&
        (
          inputs.run_tests != 'true' ||
          (
            needs.tests.result == 'success' &&
            needs.windows-user-smoke.result == 'success' &&
            needs.ui.result == 'success' &&
            needs.desktop-shell.result == 'success' &&
            needs.windows-desktop-bundle.result == 'success' &&
            needs.linux-desktop-bundle.result == 'success'
          )
        )
      }}
    environment:
      name: npm-publish
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Prepare unstable npm shim
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$NPM_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,63}$ ]]; then
            echo "Invalid npm tag: $NPM_TAG" >&2
            exit 2
          fi
          BASE_VERSION="$(node -p "require('./package.json').version")"
          UNSTABLE_VERSION="${BASE_VERSION}-${NPM_TAG}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          ARCHIVE_URL="https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.zip"
          export UNSTABLE_VERSION ARCHIVE_URL
          npm version "$UNSTABLE_VERSION" --no-git-tag-version --allow-same-version
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          version = os.environ["UNSTABLE_VERSION"]
          archive_url = os.environ["ARCHIVE_URL"]
          for relative in ("install.ps1", "update.ps1"):
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              text, version_count = re.subn(
                  r'\$DictateVersion = "[^"]+"',
                  f'$DictateVersion = "{version}"',
                  text,
              )
              text, archive_count = re.subn(
                  r'\$ArchiveUrl = "https://github\.com/arcforgelabs/dictate/archive/refs/tags/v\$DictateVersion\.zip"',
                  f'$ArchiveUrl = "{archive_url}"',
                  text,
              )
              if version_count != 1 or archive_count != 1:
                  raise SystemExit(f"failed to patch {relative}")
              path.write_text(text, encoding="utf-8")
          PY
          npm pack --dry-run
          echo "unstable_version=$UNSTABLE_VERSION" >> "$GITHUB_ENV"

      - name: Publish npm dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "npm package ${PACKAGE_NAME}@${PACKAGE_VERSION} already exists; moving ${NPM_TAG} tag"
            npm dist-tag add "${PACKAGE_NAME}@${PACKAGE_VERSION}" "${NPM_TAG}"
          else
            npm publish --access public --tag "${NPM_TAG}"
          fi
          echo "Published ${PACKAGE_NAME}@${PACKAGE_VERSION} with npm dist-tag ${NPM_TAG}"
