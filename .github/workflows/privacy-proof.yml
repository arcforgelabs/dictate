name: Privacy proof

# Meeting mode (beta) bundles pyannote.audio and torch, which the regular CI
# jobs do not install, so the pyannote telemetry test is skipped there. This
# job installs the meeting extra (CPU torch) and runs one real Meeting-mode
# pass with outbound sockets refused and syscalls traced. It runs only when
# the code it proves changes.

on:
  pull_request:
    paths:
      - "src/dictate/__init__.py"
      - "src/dictate/runtime_logging.py"
      - "src/dictate/stt/parakeet_backend.py"
      - "src/dictate/stt/parakeet_pyannote_backend.py"
      - "pyproject.toml"
      - "scripts/ci_privacy_trace.py"
      - "tests/test_third_party_telemetry.py"
      - "tests/test_runtime_logging.py"
      - ".github/workflows/privacy-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  meeting-trace:
    name: Meeting-mode privacy trace (pyannote, sockets blocked)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install ffmpeg (fixture voices, pyannote audio decoding) and strace
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg strace

      - name: Install Dictate with the meeting extra (CPU torch, versions from uv.lock)
        run: |
          python -m pip install --upgrade pip
          # The CPU index keeps the CUDA wheels out. torch, torchaudio and
          # torchcodec are ABI-coupled, so take the set uv.lock resolves together.
          python -m pip install "torch==2.8.0" "torchaudio==2.8.0" \
            --index-url https://download.pytorch.org/whl/cpu
          # onnx: lets the ONNX Runtime telemetry-store test run instead of skipping.
          python -m pip install -e ".[meeting]" "pyannote.audio==4.0.7" "torchcodec==0.7.0" "onnx==1.22.0"
          python -m pip list 2>/dev/null | grep -Ei '^(torch|torchaudio|torchcodec|pyannote\.audio|onnxruntime|onnx|opentelemetry-sdk) '

      - name: Telemetry and log tests (none may skip)
        run: |
          set -o pipefail
          python -m unittest -v tests.test_third_party_telemetry tests.test_runtime_logging 2>&1 \
            | tee "$RUNNER_TEMP/unittest.txt"
          if grep -q "skipped" "$RUNNER_TEMP/unittest.txt"; then
            echo "::error::a telemetry test was skipped; the meeting extra did not install"
            exit 1
          fi

      - name: Check for the Hugging Face token
        id: token
        env:
          DICTATE_HF_TOKEN: ${{ secrets.DICTATE_HF_TOKEN }}
        run: |
          if [ -n "$DICTATE_HF_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DICTATE_HF_TOKEN is not available to this run (fork or Dependabot PR); pyannote Community-1 is gated, so the Meeting-mode trace is skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage models and a two-voice fixture (network allowed here only)
        if: steps.token.outputs.available == 'true'
        env:
          DICTATE_HF_TOKEN: ${{ secrets.DICTATE_HF_TOKEN }}
        run: |
          python scripts/prepare-pyannote-community-model.py --output "$RUNNER_TEMP/models/pyannote-community-1"
          python scripts/prepare-parakeet-v2-int8-model.py --output "$RUNNER_TEMP/models/parakeet-v2-int8"
          bash scripts/generate-meeting-benchmark-fixtures.sh "$RUNNER_TEMP/fixture"

      - name: "Baseline: pyannote without Dictate (2026.9.27 behaviour), sockets refused"
        if: steps.token.outputs.available == 'true'
        env:
          HOME: ${{ runner.temp }}/home-baseline
        run: |
          mkdir -p "$HOME" "$RUNNER_TEMP/trace"
          python scripts/ci_privacy_trace.py baseline \
            --pyannote-model "$RUNNER_TEMP/models/pyannote-community-1" \
            --audio "$RUNNER_TEMP/fixture/flite_meeting.wav" \
            --report "$RUNNER_TEMP/trace/baseline.json"

      - name: "Meeting mode through Dictate: sockets refused, strace -f, stderr on a TTY"
        if: steps.token.outputs.available == 'true'
        env:
          HOME: ${{ runner.temp }}/home-meeting
          XDG_DATA_HOME: ${{ runner.temp }}/dictate-data
          DICTATE_PYANNOTE_MODEL_PATH: ${{ runner.temp }}/models/pyannote-community-1
          DICTATE_PARAKEET_MODEL_PATH: ${{ runner.temp }}/models/parakeet-v2-int8
          # A shell that opted in to every telemetry switch; Dictate must override them.
          PYANNOTE_METRICS_ENABLED: "true"
          HF_HUB_DISABLE_TELEMETRY: "0"
          ORT_DISABLE_TELEMETRY: "0"
        run: |
          mkdir -p "$HOME"
          T="$RUNNER_TEMP/trace"
          # script(1) gives the engine a real terminal on stderr, so the TTY and
          # log sides of the stderr tee can both be checked.
          script -qefc "strace -f -qq -e trace=connect,sendto,sendmsg,sendmmsg -e signal=none \
            -o '$T/strace.txt' python scripts/ci_privacy_trace.py meeting \
            --audio '$RUNNER_TEMP/fixture/flite_meeting.wav' --report '$T/meeting.json'" \
            "$T/terminal.txt"
          cp "$XDG_DATA_HOME/dictate/logs/latest.log" "$T/latest.log"

      - name: Check and print the redacted trace
        if: steps.token.outputs.available == 'true'
        run: |
          python scripts/ci_privacy_trace.py summarize --trace-dir "$RUNNER_TEMP/trace"
          echo "----- latest.log (complete) -----"
          cat "$RUNNER_TEMP/trace/latest.log"

      - name: Upload the trace
        if: always() && steps.token.outputs.available == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: meeting-privacy-trace
          retention-days: 30
          path: |
            ${{ runner.temp }}/trace/baseline.json
            ${{ runner.temp }}/trace/meeting.json
            ${{ runner.temp }}/trace/strace.txt
            ${{ runner.temp }}/trace/latest.log
            ${{ runner.temp }}/trace/terminal.txt
            ${{ runner.temp }}/unittest.txt
