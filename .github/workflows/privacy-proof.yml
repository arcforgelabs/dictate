name: Privacy proof

# Proves a note stays on the device: one real Parakeet note pass (ONNX
# Runtime, the Hugging Face Hub client for the model download) with outbound
# sockets refused and syscalls traced, plus the telemetry tests with nothing
# skipped. It also checks uv.lock against pyproject.toml. It runs only when the
# code it proves changes. Until #140 it traced Meeting mode (pyannote) instead.

on:
  pull_request:
    paths:
      - "src/dictate/__init__.py"
      - "src/dictate/engine.py"
      - "src/dictate/runtime_logging.py"
      - "src/dictate/stt/parakeet_backend.py"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/ci_privacy_trace.py"
      - "tests/test_third_party_telemetry.py"
      - "tests/test_runtime_logging.py"
      - ".github/workflows/privacy-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  note-trace:
    name: Note-mode privacy trace (Parakeet, sockets blocked)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install ffmpeg (fixture voice) and strace
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg strace

      - name: Check uv.lock is consistent with pyproject.toml
        run: |
          python -m pip install --upgrade pip uv
          uv lock --check

      - name: Install Dictate
        run: |
          # onnx: lets the ONNX Runtime telemetry-store test run instead of
          # skipping. Dictate does not depend on it; 1.22.0 is the version
          # uv.lock pinned while the meeting extra pulled it in (before #140).
          python -m pip install -e . "onnx==1.22.0"
          python -m pip list 2>/dev/null | grep -Ei '^(onnxruntime|onnx|onnx-asr|huggingface-hub|torch|pyannote\.audio) '
          if python -c "import torch" 2>/dev/null || python -c "import pyannote.audio" 2>/dev/null; then
            echo "::error::torch or pyannote.audio is installed with Dictate (#140)"
            exit 1
          fi

      - name: Telemetry and log tests (none may skip)
        run: |
          set -o pipefail
          python -m unittest -v tests.test_third_party_telemetry tests.test_runtime_logging 2>&1 \
            | tee "$RUNNER_TEMP/unittest.txt"
          if grep -q "skipped" "$RUNNER_TEMP/unittest.txt"; then
            echo "::error::a telemetry test was skipped"
            exit 1
          fi

      - name: Stage the model and a spoken fixture (network allowed here only)
        run: |
          python scripts/prepare-parakeet-v2-int8-model.py --output "$RUNNER_TEMP/models/parakeet-v2-int8"
          bash scripts/generate-benchmark-fixtures.sh "$RUNNER_TEMP/fixture"

      - name: "Note through Dictate: sockets refused, strace -f, stderr on a TTY"
        env:
          HOME: ${{ runner.temp }}/home-note
          XDG_DATA_HOME: ${{ runner.temp }}/dictate-data
          DICTATE_PARAKEET_MODEL_PATH: ${{ runner.temp }}/models/parakeet-v2-int8
          # A shell that opted in to every telemetry switch; Dictate must override them.
          HF_HUB_DISABLE_TELEMETRY: "0"
          ORT_DISABLE_TELEMETRY: "0"
        run: |
          mkdir -p "$HOME" "$RUNNER_TEMP/trace"
          T="$RUNNER_TEMP/trace"
          # script(1) gives the engine a real terminal on stderr, so the TTY and
          # log sides of the stderr tee can both be checked.
          script -qefc "strace -f -qq -e trace=execve,connect,sendto,sendmsg,sendmmsg -e signal=none \
            -o '$T/strace.txt' python scripts/ci_privacy_trace.py note \
            --audio '$RUNNER_TEMP/fixture/flite_review.wav' --report '$T/note.json'" \
            "$T/terminal.txt"
          cp "$XDG_DATA_HOME/dictate/logs/latest.log" "$T/latest.log"

      - name: Check and print the redacted trace
        run: |
          python scripts/ci_privacy_trace.py summarize --trace-dir "$RUNNER_TEMP/trace"
          echo "----- latest.log (complete) -----"
          cat "$RUNNER_TEMP/trace/latest.log"

      - name: Upload the trace
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: note-privacy-trace
          retention-days: 30
          path: |
            ${{ runner.temp }}/trace/note.json
            ${{ runner.temp }}/trace/strace.txt
            ${{ runner.temp }}/trace/latest.log
            ${{ runner.temp }}/trace/terminal.txt
            ${{ runner.temp }}/unittest.txt
