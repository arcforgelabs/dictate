name: Release

on:
  push:
    tags: ["v20*"]

permissions:
  contents: write
  id-token: write

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[x11]"

      - name: Install package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install-windows.ps1 -NoPrepareTurbo -NoVerify -NoShortcut

      - name: Compile Python sources on Linux
        if: runner.os == 'Linux'
        run: python -m compileall src tests scripts

      - name: Compile Python sources on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m compileall src tests scripts

      - name: Run unit tests on Linux
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests

      - name: Run unit tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests

      - name: Show version on Linux
        if: runner.os == 'Linux'
        run: dictate --version

      - name: Show version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\dictate.exe --version

  windows-user-smoke:
    name: Windows user install smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run Windows user install/update/uninstall smoke
        shell: pwsh
        run: .\scripts\windows-user-smoke.ps1 -InstallRoot "$env:RUNNER_TEMP\DictateUserSmoke"

  release:
    runs-on: ubuntu-latest
    needs: [tests, windows-user-smoke]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve release tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        run: git checkout --detach "${{ steps.version.outputs.tag }}"

      - name: Validate release metadata
        run: python scripts/release_check.py --tag "${{ steps.version.outputs.tag }}"

      - name: Run release checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[x11]"
          python -m compileall src tests scripts
          python -m unittest discover -s tests

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Validate npm package
        run: npm pack --dry-run

      - name: Publish npm package
        # Best-effort: the npm shim is a convenience, not the primary artifact.
        # A publish failure (e.g. scope/token not configured) must not block the
        # GitHub release and the downloadable .deb/AppImage that follow.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "npm package ${PACKAGE_NAME}@${PACKAGE_VERSION} already exists; skipping publish"
          elif npm publish --access public --tag latest; then
            echo "Published ${PACKAGE_NAME}@${PACKAGE_VERSION} to npm"
          else
            echo "::warning::npm publish failed (scope/token not configured); continuing release without npm"
          fi

      - name: Create GitHub release
        # Idempotent: re-running the pipeline (e.g. after a desktop-bundle fix)
        # must update the existing release rather than fail on a duplicate.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ASSETS=(dist/* \
            install.ps1 install-windows.ps1 install-windows-wizard.ps1 \
            update.ps1 update-windows.ps1 uninstall-windows.ps1 \
            install.sh update.sh uninstall.sh)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --verify-tag \
              --title "Dictate ${{ steps.version.outputs.version }}" \
              --notes "CalVer release ${{ steps.version.outputs.version }}."
          fi

  linux-desktop:
    name: Linux desktop bundle (.deb + AppImage)
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Resolve release tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        run: git checkout --detach "${{ steps.version.outputs.tag }}"

      - name: Install Tauri + engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev \
            python3-dev portaudio19-dev

      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build the desktop bundle (freezes engine + builds .deb/AppImage)
        # APPIMAGE_EXTRACT_AND_RUN: linuxdeploy/appimagetool can't FUSE-mount in
        # CI; extract-and-run avoids it. NO_STRIP avoids strip failures on the
        # bundled engine's prebuilt native libs.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          ARCH: "x86_64"
        run: ./scripts/build-linux-desktop.sh

      - name: Attach .deb and AppImage to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t ARTIFACTS < <(find ui-shell/src-tauri/target/release/bundle \
            -type f \( -name '*.deb' -o -name '*.AppImage' \))
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "No desktop artifacts were produced." >&2
            exit 1
          fi
          printf '%s\n' "${ARTIFACTS[@]}"
          gh release upload "${{ steps.version.outputs.tag }}" "${ARTIFACTS[@]}" --clobber
