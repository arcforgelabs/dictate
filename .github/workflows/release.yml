name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing CalVer tag to release, for example v2026.6.6"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-release-ref:
    name: Validate release tag provenance
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.provenance.outputs.tag }}
      tag_sha: ${{ steps.provenance.outputs.tag_sha }}
      version: ${{ steps.provenance.outputs.version }}
    steps:
      - name: Verify tag is reviewed on the default branch
        id: provenance
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref_name }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this release workflow from ${DEFAULT_BRANCH}, not ${DISPATCH_REF}." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v20[0-9][0-9]\.[0-9]{1,2}\.[0-9]{1,2}(-[0-9]+)?$ ]]; then
            echo "Release tag must match vYYYY.M.D or vYYYY.M.D-N and start with v20." >&2
            exit 1
          fi

          git init --quiet .release-provenance
          cd .release-provenance
          git remote add origin "https://github.com/${GH_REPOSITORY}.git"
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git fetch --no-tags --depth=1 origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"

          if ! git merge-base --is-ancestor "$TAG_SHA" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "Release tag ${RELEASE_TAG} (${TAG_SHA}) is not reachable from ${DEFAULT_BRANCH}." >&2
            echo "Refusing to publish artifacts from an unreviewed commit." >&2
            exit 1
          fi

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${TAG_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: [validate-release-ref]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate-release-ref.outputs.tag_sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[x11]"

      - name: Install package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install-windows.ps1 -NoPrepareTurbo -NoVerify -NoShortcut

      - name: Compile Python sources on Linux
        if: runner.os == 'Linux'
        run: python -m compileall src tests scripts

      - name: Compile Python sources on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m compileall src tests scripts

      - name: Run unit tests on Linux
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests

      - name: Run unit tests on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: .venv\Scripts\python.exe -m unittest discover -s tests

      - name: Show version on Linux
        if: runner.os == 'Linux'
        run: dictate --version

      - name: Show version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\dictate.exe --version

  windows-user-smoke:
    name: Windows user install smoke
    runs-on: windows-latest
    needs: [validate-release-ref]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate-release-ref.outputs.tag_sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Run Windows user install/update/uninstall smoke
        shell: pwsh
        run: .\scripts\windows-user-smoke.ps1 -InstallRoot "$env:RUNNER_TEMP\DictateUserSmoke"

  linux-user-sync-smoke:
    name: Linux user install sync smoke
    runs-on: ubuntu-latest
    needs: [validate-release-ref]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate-release-ref.outputs.tag_sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Linux smoke prerequisites
        run: |
          python -m pip install --upgrade pip uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Linux user install encrypted-sync smoke
        run: ./scripts/linux-user-sync-smoke.sh

  release:
    runs-on: ubuntu-latest
    needs: [validate-release-ref, tests, windows-user-smoke, linux-user-sync-smoke]
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate-release-ref.outputs.tag_sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Validate release metadata
        run: python scripts/release_check.py --tag "${{ needs.validate-release-ref.outputs.tag }}"

      - name: Run release checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[x11]"
          python -m compileall src tests scripts
          python -m unittest discover -s tests

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Validate npm package
        run: npm pack --dry-run

      - name: Create GitHub release
        # Idempotent: re-running the pipeline (e.g. after a desktop-bundle fix)
        # must update the existing release rather than fail on a duplicate.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.validate-release-ref.outputs.tag }}"
          ASSETS=(dist/* \
            install.ps1 install-windows.ps1 install-windows-wizard.ps1 \
            update.ps1 update-windows.ps1 uninstall-windows.ps1 \
            install.sh update.sh uninstall.sh)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --verify-tag \
              --title "Dictate ${{ needs.validate-release-ref.outputs.version }}" \
              --notes "CalVer release ${{ needs.validate-release-ref.outputs.version }}."
          fi

  npm-publish:
    name: npm publish
    runs-on: ubuntu-latest
    needs: [validate-release-ref, tests, windows-user-smoke, linux-user-sync-smoke]
    environment:
      name: npm-publish
    permissions:
      contents: read
      # Required to mint the OIDC token for `provenance: true` in package.json.
      # Without it `npm publish` fails to generate provenance and (because the
      # publish step is best-effort) the release silently ships without the npm
      # package — which is why 2026.7.x never reached the registry.
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate-release-ref.outputs.tag_sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish npm package
        # Best-effort: the npm shim is a convenience, not the primary artifact.
        # A publish failure (e.g. scope/token not configured) must not block the
        # GitHub release and downloadable desktop package that follow.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "npm package ${PACKAGE_NAME}@${PACKAGE_VERSION} already exists; skipping publish"
          elif npm publish --access public --tag latest; then
            echo "Published ${PACKAGE_NAME}@${PACKAGE_VERSION} to npm"
          else
            echo "::warning::npm publish failed (scope/token not configured); continuing release without npm"
          fi

  linux-desktop:
    name: Linux desktop bundle (.deb)
    runs-on: ubuntu-latest
    needs: [validate-release-ref, release]
    environment:
      name: release
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate-release-ref.outputs.tag_sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Tauri + engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev \
            python3-dev portaudio19-dev

      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build the desktop bundle (freezes engine + builds .deb)
        env:
          DICTATE_BUNDLES: "deb"
          NO_STRIP: "true"
          ARCH: "x86_64"
        run: ./scripts/build-linux-desktop.sh

      - name: Attach .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t ARTIFACTS < <(find ui-shell/src-tauri/target/release/bundle \
            -type f -name '*.deb')
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "No desktop artifacts were produced." >&2
            exit 1
          fi
          printf '%s\n' "${ARTIFACTS[@]}"
          gh release upload "${{ needs.validate-release-ref.outputs.tag }}" "${ARTIFACTS[@]}" --clobber

  windows-desktop:
    name: Windows desktop bundle (.msi + installer .exe)
    runs-on: windows-latest
    needs: [validate-release-ref, release]
    environment:
      name: windows-signing
    permissions:
      contents: write
    env:
      HAS_WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX_B64 != '' }}
      HAS_WINDOWS_SIGNING_CERT_PATH: ${{ vars.WINDOWS_SIGNING_CERT_PATH != '' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate-release-ref.outputs.tag_sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup default stable

      - name: Install Windows bundling dependencies
        shell: pwsh
        run: choco install wixtoolset nsis -y --no-progress

      - name: Build the Windows desktop bundle
        shell: pwsh
        run: .\scripts\build-windows-desktop.ps1

      - name: Sign Windows desktop artifacts
        if: env.HAS_WINDOWS_SIGNING_PFX == 'true' || env.HAS_WINDOWS_SIGNING_CERT_PATH == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_B64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_CERT_PATH: ${{ vars.WINDOWS_SIGNING_CERT_PATH }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: .\scripts\sign-windows-artifacts.ps1

      - name: Check whether Windows artifacts are signed
        id: signed
        shell: pwsh
        run: |
          try {
            .\scripts\assert-windows-artifacts-signed.ps1
            Add-Content -Path $env:GITHUB_OUTPUT -Value "upload=true"
          } catch {
            Write-Warning $_.Exception.Message
            Write-Warning "Skipping public GitHub release upload for unsigned Windows artifacts."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "upload=false"
          }

      - name: Upload unsigned Windows artifacts for internal validation
        if: steps.signed.outputs.upload != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unsigned-windows-desktop-bundle
          path: |
            ui-shell/src-tauri/target/release/bundle/msi/*.msi
            ui-shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach signed Windows desktop artifacts to the release
        if: steps.signed.outputs.upload == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifacts = Get-ChildItem "ui-shell\src-tauri\target\release\bundle" -Recurse -File |
            Where-Object { $_.Extension -in ".msi", ".exe" } |
            Select-Object -ExpandProperty FullName
          if (-not $artifacts) {
            throw "No Windows desktop artifacts were produced."
          }
          $artifacts | ForEach-Object { Write-Host $_ }
          gh release upload "${{ needs.validate-release-ref.outputs.tag }}" $artifacts --clobber
