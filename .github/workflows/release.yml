name: Release

on:
  push:
    tags: ["v20*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing CalVer version to release, without leading v"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        run: git checkout --detach "${{ steps.version.outputs.tag }}"

      - name: Validate release metadata
        run: python scripts/release_check.py --tag "${{ steps.version.outputs.tag }}"

      - name: Run release checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[x11]"
          python -m compileall src tests scripts
          python -m unittest discover -s tests

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/* install.ps1 install-windows.ps1 \
            --verify-tag \
            --title "Dictate ${{ steps.version.outputs.version }}" \
            --notes "CalVer release ${{ steps.version.outputs.version }}."
