# TEMPORARY proof for PR #133: statically parse the inlined barnacle.yml with
# actionlint, because its real triggers only load it from the default branch.
# Removed again in the next commit on this branch; never reaches master.
name: tmp actionlint barnacle

on:
  pull_request:
    paths:
      - .github/workflows/barnacle.yml
      - .github/workflows/tmp-actionlint-barnacle.yml

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: actionlint barnacle.yml
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          git log -1 --format='linted commit %H'
          sha256sum .github/workflows/barnacle.yml
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -version
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -verbose .github/workflows/barnacle.yml
          echo "actionlint: no problems in .github/workflows/barnacle.yml"
