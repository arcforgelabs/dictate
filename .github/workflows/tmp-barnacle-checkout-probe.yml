# TEMPORARY proof for PR #133. Runs the inline Barnacle job's token and
# checkout steps unchanged (read-only token permissions), then imports
# barnacle/run.mjs and checks its exports without calling them.
# Removed again in the next commit on this branch; never reaches master.
name: tmp Barnacle checkout probe

on:
  pull_request:
    paths:
      - .github/workflows/tmp-barnacle-checkout-probe.yml

permissions: {}

jobs:
  probe:
    # Same-repo branches only; fork PRs never receive the app secret.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.BARNACLE_APP_ID }}
          private-key: ${{ secrets.BARNACLE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},.github
          permission-contents: read
          permission-metadata: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arcforgelabs/.github
          ref: d1877d0bac0d77e614929580f071437d8ad3ac71 # arcforgelabs/.github main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Import barnacle/run.mjs and check exports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { execSync } = require("node:child_process");
            const { pathToFileURL } = require("node:url");
            core.info(`checked out ${execSync("git rev-parse HEAD", { cwd: process.env.GITHUB_WORKSPACE }).toString().trim()}`);
            const mod = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/barnacle/run.mjs`).href);
            core.info(`typeof run = ${typeof mod.run}; typeof runPrCap = ${typeof mod.runPrCap}`);
            if (typeof mod.run !== "function" || typeof mod.runPrCap !== "function") {
              core.setFailed("barnacle/run.mjs does not export run and runPrCap");
            }
