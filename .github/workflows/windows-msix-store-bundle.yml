name: Windows Store MSIX bundle (manual)

# Manual builder for the Partner Center MSIX/PWA product:
# Arc Forge Dictate / Store ID 9P5S7747V0BP.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  bundle:
    name: Build Windows Store MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup default stable

      - name: Install winapp CLI
        shell: pwsh
        run: |
          if (-not (Get-Command winapp -ErrorAction SilentlyContinue)) {
            winget install microsoft.winappcli --source winget --accept-package-agreements --accept-source-agreements
          }
          $winappPath = (Get-Command winapp -ErrorAction SilentlyContinue).Source
          if (-not $winappPath) {
            $winappPath = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter winapp.exe -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $winappPath) {
            $winappPath = Get-ChildItem "$env:ProgramFiles" -Recurse -Filter winapp.exe -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $winappPath) {
            throw "winapp.exe was not found after installation."
          }
          $winappDir = Split-Path $winappPath
          $winappDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $winappPath --version

      - name: Build Store MSIX
        shell: pwsh
        env:
          DICTATE_HF_TOKEN: ${{ secrets.DICTATE_HF_TOKEN }}
        run: .\scripts\build-windows-msix-store.ps1 -Python "${{ env.pythonLocation }}\python.exe" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\windows-msix.log"

      - name: Upload Store MSIX artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-store-msix
          path: packaging/msix/out/*.msix
          if-no-files-found: error

      - name: Upload MSIX build log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-msix-log
          path: ${{ runner.temp }}\windows-msix.log
          if-no-files-found: ignore
