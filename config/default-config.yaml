hotwords: []
push_to_talk_combo: ctrl_r
stt_compute_type: int8
stt_device: auto
# Leave stt_backend/stt_model unset for the hardware-aware local default:
# English Parakeet on CPU when available; current CUDA builds use faster-whisper
# until the Parakeet CUDA lane is implemented and benchmarked.
# Set stt_backend/stt_model explicitly to override:
# stt_backend: parakeet
# stt_model: parakeet-tdt-0.6b-v2
# stt_backend: faster-whisper
# stt_model: turbo
# stt_model: large-v3
# To avoid local compute, set one hosted backend:
# stt_backend: openai
# stt_model: gpt-4o-mini-transcribe
# openai_api_key_command: /path/to/command/that/prints/the/key
# stt_backend: xai
# stt_model: grok-speech-to-text
# xai_api_key_command: /path/to/command/that/prints/the/key
# stt_backend: gemini
# stt_model: gemini-3-flash-preview
# gemini_api_key_command: /path/to/command/that/prints/the/key
