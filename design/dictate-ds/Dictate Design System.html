<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dictate — Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="ds.css" />
<style>html,body{height:auto;overflow:visible;}</style>
</head>
<body class="ds-body">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="ds-foundations.jsx"></script>
<script type="text/babel" src="ds-components.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const PRINCIPLES = [
  ["moon", "Quiet by default", "Lives in the tray and recedes until summoned. The UI is calm, never attention-seeking."],
  ["shield", "Local-first & honest", "Show where audio goes. Keys live in the OS keychain; nothing leaves the device silently."],
  ["sun", "Warm, not clinical", "Paper greyscale and soft radii — a tool that feels human, with one living green for ‘listening’."],
  ["wave", "Calm motion", "A single breathing pulse signals a live agent. Everything else settles and stops."],
];
const STRIP = ["--bg", "--surface", "--surface-3", "--fg", "--muted", "--live", "--danger"];
const NAV = [["brand", "Brand"], ["color", "Color"], ["type", "Type"], ["space", "Spacing"], ["motion", "Motion"], ["controls", "Controls"], ["containers", "Containers"], ["patterns", "Patterns"]];

function DS() {
  const [theme, setTheme] = useState("light");
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.setAttribute("data-ambient", "on");
  }, [theme]);

  const jump = (e, id) => { e.preventDefault(); const el = document.getElementById(id); if (el) window.scrollTo({ top: el.offsetTop - 70, behavior: "smooth" }); };

  return (
    <React.Fragment>
      <div className="ds-top">
        <div className="ds-brand"><span className="mk"><ArcMark /></span>Dictate<span className="tag">Design System</span></div>
        <nav className="ds-nav">{NAV.map(([id, l]) => <a key={id} href={"#" + id} onClick={e => jump(e, id)}>{l}</a>)}</nav>
        <button className="ds-themebtn" onClick={() => setTheme(theme === "dark" ? "light" : "dark")} title="Toggle theme">
          <Icon name={theme === "dark" ? "sun" : "moon"} size={17} /></button>
      </div>

      <div className="ds-page">
        <header className="ds-mast">
          <div className="eyebrow"><span style={{ width: 16, height: 16, color: "var(--fg)", display: "flex" }}><ArcMark /></span>Dictate · Quiet Console v1</div>
          <h1>The Quiet <em>Console</em></h1>
          <p className="lede">The design language behind Dictate — desktop dictation that types into the focused app.
            A warm, recessive system tuned for a tool that lives in the tray: <strong>calm surfaces, honest status, and motion only where it means something.</strong> Everything on this page is the live code the app ships.</p>
          <div className="ds-strip">{STRIP.map(v => <i key={v} style={{ background: `var(${v})` }} />)}<span className="lbl">light · dark · one source</span></div>
          <div className="ds-principles">{PRINCIPLES.map(([ic, t, d]) => (
            <div className="ds-princ" key={t}><div className="pic"><Icon name={ic} size={18} /></div><h4>{t}</h4><p>{d}</p></div>
          ))}</div>
        </header>

        <Foundations />
        <Components />

        <div className="ds-foot-credit"><span>Dictate Design System · Quiet Console</span><span className="t-mono">v2026.2.25</span></div>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<DS />);
</script>
</body>
</html>
