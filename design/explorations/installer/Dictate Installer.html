<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dictate — Windows installer</title>
<link rel="stylesheet" href="installer.css" />
<style>
  html,body{margin:0;height:100%;}
  body{background:radial-gradient(130% 120% at 50% 0%, var(--bg) 0%, var(--bg-2) 100%);
    transition:background var(--t);overflow:hidden;}
  body[data-theme="dark"]{--bg:#0a0a0b;--bg-2:#050506;}
  #root{position:fixed;inset:0;display:grid;place-items:center;}
  #scaler{transform-origin:center center;}
  /* solo: the stage is just the window; the desktop backdrop is on <body> */
  .istage.solo{width:auto;height:auto;display:block;background:none;border-radius:0;overflow:visible;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="installer-shared.jsx"></script>
<script type="text/babel" src="installer-flow.jsx"></script>
<script type="text/babel" src="installer-b.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "system",
  "launchOnLogin": true,
  "desktopShortcut": false,
  "feel": "measured",
  "modelPresent": false,
  "showPublisher": false,
  "publisher": "Arc Forge"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const scalerRef = useRef(null);

  // follow the OS light/dark setting when theme is "system"
  const mq = () => window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
  const [osDark, setOsDark] = useState(() => { const m = mq(); return m ? m.matches : false; });
  useEffect(() => {
    const m = mq(); if (!m) return;
    const onChange = e => setOsDark(e.matches);
    m.addEventListener ? m.addEventListener("change", onChange) : m.addListener(onChange);
    return () => { m.removeEventListener ? m.removeEventListener("change", onChange) : m.removeListener(onChange); };
  }, []);
  const effectiveTheme = t.theme === "system" ? (osDark ? "dark" : "light") : t.theme;

  // keep <body> backdrop in sync with the resolved theme
  useEffect(() => {
    document.body.setAttribute("data-theme", effectiveTheme);
  }, [effectiveTheme]);

  // fit the window to the viewport (gentle upscale on big screens)
  useEffect(() => {
    const fit = () => {
      const el = scalerRef.current; if (!el) return;
      const W = 476, H = 418, pad = 56;
      const s = Math.min(1.3, (window.innerWidth - pad) / W, (window.innerHeight - pad) / H);
      el.style.transform = `scale(${Math.max(0.4, s)})`;
    };
    fit(); window.addEventListener("resize", fit);
    return () => window.removeEventListener("resize", fit);
  }, []);

  const speedMul = t.feel === "quick" ? 2.1 : 1;

  return (
    <>
      <div id="scaler" ref={scalerRef}>
        <InstallerB
          solo
          theme={effectiveTheme}
          onTheme={() => setTweak("theme", effectiveTheme === "dark" ? "light" : "dark")}
          publisher={t.publisher}
          showPublisher={t.showPublisher}
          defaults={{ launchOnLogin: t.launchOnLogin, desktopShortcut: t.desktopShortcut }}
          speedMul={speedMul}
          modelPresent={t.modelPresent}
        />
      </div>

      <TweaksPanel>
        <TweakSection label="Appearance" />
        <TweakRadio label="Theme" value={t.theme} options={["system", "light", "dark"]}
          onChange={v => setTweak("theme", v)} />
        <TweakSection label="Install defaults" />
        <TweakToggle label="Launch on sign-in" value={t.launchOnLogin}
          onChange={v => setTweak("launchOnLogin", v)} />
        <TweakToggle label="Desktop shortcut" value={t.desktopShortcut}
          onChange={v => setTweak("desktopShortcut", v)} />
        <TweakSection label="Progress" />
        <TweakRadio label="Install feel" value={t.feel} options={["quick", "measured"]}
          onChange={v => setTweak("feel", v)} />
        <TweakToggle label="Model already on PC" value={t.modelPresent}
          onChange={v => setTweak("modelPresent", v)} />
        <TweakSection label="Trust" />
        <TweakToggle label="Verified-publisher row" value={t.showPublisher}
          onChange={v => setTweak("showPublisher", v)} />
        <TweakText label="Publisher" value={t.publisher}
          onChange={v => setTweak("publisher", v)} />
      </TweaksPanel>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
