<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dictate — Simplified UI Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ===== Dictate tokens (lifted verbatim from the design system) ===== */
:root{
  --bg:#efece6; --bg-2:#e9e5dd; --surface:#fff; --surface-2:#f7f5f1; --surface-3:#f0ede7;
  --fg:#1b1a16; --muted:rgba(27,26,22,.56); --subtle:rgba(27,26,22,.40); --faint:rgba(27,26,22,.22);
  --border:rgba(27,26,22,.10); --border-2:rgba(27,26,22,.16); --hairline:rgba(27,26,22,.07);
  --primary:#1b1a16; --primary-fg:#faf8f4; --primary-hover:#322f29;
  --live:#2f8f63; --live-bg:rgba(47,143,99,.12); --danger:#c5402c; --danger-bg:rgba(197,64,44,.10); --amber:#c08a2d;
  --shadow-sm:0 1px 2px rgba(27,26,22,.05),0 1px 1px rgba(27,26,22,.04);
  --shadow-md:0 2px 4px rgba(27,26,22,.05),0 6px 16px rgba(27,26,22,.07);
  --shadow-lg:0 8px 24px rgba(27,26,22,.10),0 24px 48px rgba(27,26,22,.10);
  --shadow-pop:0 12px 32px rgba(27,26,22,.16),0 2px 8px rgba(27,26,22,.10);
  --r-sm:9px; --r-md:13px; --r-lg:18px; --r-xl:24px; --r-pill:999px;
  --font-ui:"Hanken Grotesk",system-ui,sans-serif; --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.22,.61,.36,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --t-fast:140ms var(--ease); --t:240ms var(--ease); --t-slow:420ms var(--ease-out);
}
[data-theme="dark"]{
  --bg:#0a0a0b; --bg-2:#050506; --surface:#19191c; --surface-2:#212126; --surface-3:#2c2c33;
  --fg:#f3f1ec; --muted:rgba(243,241,236,.60); --subtle:rgba(243,241,236,.42); --faint:rgba(243,241,236,.22);
  --border:rgba(243,241,236,.14); --border-2:rgba(243,241,236,.24); --hairline:rgba(243,241,236,.09);
  --primary:#f3f1ec; --primary-fg:#161618; --primary-hover:#dedbd3;
  --live:#4fbd86; --live-bg:rgba(79,189,134,.14); --danger:#ff6b5b; --danger-bg:rgba(255,107,91,.13); --amber:#c08a2d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 6px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
  --shadow-lg:0 10px 30px rgba(0,0,0,.5),0 30px 60px rgba(0,0,0,.45);
  --shadow-pop:0 14px 40px rgba(0,0,0,.6),0 2px 10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
.t-mono{font-family:var(--font-mono);font-size:11.5px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;}
.t-label{font-family:var(--font-ui);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--subtle);}

/* ===== window shell ===== */
.themewrap{position:absolute;inset:0;background:
  radial-gradient(120% 120% at 50% 0%, var(--bg) 0%, var(--bg-2) 100%);
  display:flex;padding:16px;font-family:var(--font-ui);color:var(--fg);}
.dwin{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;}
.dwin-tb{height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;border-bottom:1px solid var(--hairline);background:var(--surface-2);}
.dwin-brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;letter-spacing:-.01em;}
.dwin-brand .mark{width:16px;height:16px;color:var(--fg);display:flex;}
.tb-right{display:flex;align-items:center;gap:8px;}
.ibtn{width:30px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);background:none;border:none;cursor:pointer;transition:var(--t-fast);}
.ibtn:hover{background:var(--surface-3);color:var(--fg);}
.cmdhint{display:inline-flex;align-items:center;gap:2px;height:24px;padding:0 9px;border-radius:7px;
  background:var(--surface-3);color:var(--muted);font-family:var(--font-mono);font-size:11px;font-weight:600;}

/* keycaps / chips shared */
.keys{display:inline-flex;align-items:center;gap:3px;}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;
  border:1px solid var(--border-2);border-bottom-width:2px;border-radius:7px;background:var(--surface);
  font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--fg);}
.plus{color:var(--subtle);font-size:11px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto;}
.dot.live{background:var(--live);box-shadow:0 0 0 0 rgba(47,143,99,.4);animation:breath 3.8s var(--ease) infinite;}
.xai{display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:var(--r-pill);
  background:var(--surface-3);border:1px solid var(--border);color:var(--muted);
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;}
.xai.sm{height:18px;padding:0 7px;font-size:9px;}
.toggle{display:inline-flex;width:38px;height:22px;border-radius:var(--r-pill);background:var(--surface-3);
  border:1px solid var(--border);position:relative;flex:0 0 auto;}
.toggle .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:var(--t);}
.toggle.on{background:var(--live);border-color:var(--live);}
.toggle.on .knob{left:18px;}
.reckdot{width:9px;height:9px;border-radius:50%;background:var(--danger);flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(197,64,44,.45);animation:rec 1.6s ease infinite;}

/* waveform */
.wave{display:flex;align-items:center;gap:3px;height:30px;}
.wave i{width:3px;border-radius:3px;background:var(--faint);display:block;}
.wave.live i{background:var(--live);animation:wavep 1.1s var(--ease) infinite;}
.wave.live i:nth-child(3n){animation-delay:.2s;} .wave.live i:nth-child(3n+1){animation-delay:.45s;}

/* ===== A · Minimal Home ===== */
.a-home{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:26px 30px;}
.a-status{display:flex;align-items:center;gap:9px;color:var(--muted);justify-content:center;}
.a-tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.a-tile{display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-align:left;
  padding:20px;border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--border);
  cursor:pointer;transition:var(--t-fast);min-height:160px;}
.a-tile:hover{border-color:var(--border-2);box-shadow:var(--shadow-md);transform:translateY(-2px);}
.a-tile.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg);}
.a-tile .t-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--border);color:var(--fg);margin-bottom:4px;}
.a-tile.primary .t-ico{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.16);color:var(--primary-fg);}
.a-tile .t-name{font-size:16px;font-weight:700;letter-spacing:-.01em;}
.a-tile .t-sub{font-size:12.5px;line-height:1.5;color:var(--muted);}
.a-tile.primary .t-sub{color:rgba(250,248,244,.72);}
.a-tile .t-foot{margin-top:auto;}
.a-tile.primary .kbd{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:var(--primary-fg);}
.a-tile.primary .plus{color:rgba(250,248,244,.6);}

/* A listening */
.a-listen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;}
.orb{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:1px solid var(--live);color:var(--live);}
.orb.breath{box-shadow:0 0 0 0 var(--live-bg);animation:breath 3.8s var(--ease) infinite;}
.l-title{font-size:20px;font-weight:800;letter-spacing:-.02em;}
.l-sub{color:var(--muted);display:flex;align-items:center;gap:6px;}
.l-sub .kbd{height:18px;min-width:18px;font-size:10px;}

/* ===== B · Mode Switcher ===== */
.b-seg{margin:22px auto 0;display:inline-flex;align-self:center;background:var(--surface-3);
  border:1px solid var(--border);border-radius:var(--r-pill);padding:3px;gap:2px;}
.seg-btn{height:34px;padding:0 20px;border-radius:var(--r-pill);background:none;border:none;cursor:pointer;
  font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--muted);transition:var(--t-fast);}
.seg-btn.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm);}
[data-theme="dark"] .seg-btn.on{background:var(--surface);}
.b-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 30px 30px;}
.hold-target,.rec-target{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--primary);color:var(--primary-fg);border:none;cursor:pointer;transition:var(--t-fast);}
.hold-target:hover,.rec-target:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.rec-target{background:var(--surface-2);border:1px solid var(--border-2);color:var(--danger);}
.rec-target.live{background:var(--danger-bg);border-color:var(--danger);}
.b-line{font-size:14.5px;color:var(--muted);}
.b-ctl{color:var(--muted);display:flex;align-items:center;gap:6px;}
.b-row{display:flex;align-items:center;gap:12px;width:100%;max-width:380px;margin-top:2px;
  padding:13px 15px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border);}
.b-row-l{flex:1;display:flex;flex-direction:column;gap:2px;}
.t-name2{font-size:13.5px;font-weight:600;} .t-sub2{font-size:11.5px;color:var(--muted);}
.b-rec-meta{display:flex;align-items:center;gap:10px;}
.b-rec-meta .t-mono{color:var(--muted);}

/* ===== C · Compact Console ===== */
.dwin.compact .dwin-tb{height:42px;flex-basis:42px;}
.c-tabs{display:flex;gap:2px;}
.c-tab{width:30px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:var(--subtle);background:none;border:none;cursor:pointer;transition:var(--t-fast);}
.c-tab:hover{background:var(--surface-3);color:var(--muted);}
.c-tab.on{background:var(--surface-3);color:var(--fg);}
.c-body{flex:1;display:flex;flex-direction:column;gap:14px;padding:18px 18px 20px;}
.c-capture{display:flex;gap:10px;}
.c-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;height:46px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--border);color:var(--fg);cursor:pointer;
  font-family:var(--font-ui);font-size:14px;font-weight:600;transition:var(--t-fast);}
.c-btn:hover{border-color:var(--border-2);box-shadow:var(--shadow-sm);}
.c-btn .keys{margin-left:2px;} .c-btn .kbd{height:20px;min-width:20px;font-size:10px;}
.c-btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg);}
.c-btn.primary .kbd{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:var(--primary-fg);}
.c-btn.primary .plus{color:rgba(250,248,244,.6);}
.c-btn .xai{color:var(--muted);}
.c-meta{color:var(--subtle);text-align:center;}
.c-rows{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;transition:var(--t);}
.c-rows.dim{opacity:.4;}
.c-row{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;background:var(--surface);
  border:none;border-top:1px solid var(--hairline);cursor:pointer;color:var(--fg);text-align:left;transition:var(--t-fast);}
.c-row:first-child{border-top:none;}
.c-row:hover{background:var(--surface-2);}
.c-row .c-k{width:84px;flex:0 0 auto;}
.c-row .c-v{flex:1;font-size:13px;color:var(--muted);display:flex;align-items:center;}
.c-row svg{color:var(--subtle);}
.c-listenbar{display:flex;align-items:center;gap:12px;height:46px;padding:0 16px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--border);}
.c-listenbar .t-mono{color:var(--fg);}
.c-listenbar .wave{flex:1;justify-content:center;height:22px;}
.c-release{color:var(--subtle);display:flex;align-items:center;gap:5px;}
.c-listenbar .kbd{height:18px;min-width:18px;font-size:10px;}

/* ===== motion ===== */
@keyframes breath{0%,100%{box-shadow:0 0 0 0 var(--live-bg);}50%{box-shadow:0 0 0 12px rgba(47,143,99,0);}}
@keyframes rec{0%,100%{box-shadow:0 0 0 0 rgba(197,64,44,.45);}50%{box-shadow:0 0 0 7px rgba(197,64,44,0);}}
@keyframes wavep{0%,100%{transform:scaleY(.5);}50%{transform:scaleY(1.25);}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;}}
</style>
</head>
<body>
<div id="stage"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="concepts.jsx"></script>
<script type="text/babel">
const { useEffect } = React;
function Board() {
  return (
    <DesignCanvas title="Dictate · Simplified UI — 3 concepts">
      <DCSection id="a" title="A · Minimal Home" subtitle="Capture-first; settings collapsed behind the gear + ⌘K">
        <DCArtboard id="a-l" label="Light · idle" width={560} height={420}><ConceptA theme="light" /></DCArtboard>
        <DCArtboard id="a-d" label="Dark · idle" width={560} height={420}><ConceptA theme="dark" /></DCArtboard>
        <DCArtboard id="a-r" label="Dark · recording" width={560} height={420}><ConceptA theme="dark" rec /></DCArtboard>
      </DCSection>
      <DCSection id="b" title="B · Mode Switcher" subtitle="Quick / Record are mutually exclusive; context controls follow the active mode">
        <DCArtboard id="b-q" label="Light · Quick mode" width={560} height={420}><ConceptB theme="light" mode="quick" /></DCArtboard>
        <DCArtboard id="b-r" label="Dark · Record mode" width={560} height={420}><ConceptB theme="dark" mode="record" /></DCArtboard>
        <DCArtboard id="b-rec" label="Dark · recording" width={560} height={420}><ConceptB theme="dark" rec /></DCArtboard>
      </DCSection>
      <DCSection id="c" title="C · Compact Console" subtitle="Power-user; no left rail, top icon tabs, dense but calm">
        <DCArtboard id="c-l" label="Light · idle" width={600} height={384}><ConceptC theme="light" /></DCArtboard>
        <DCArtboard id="c-d" label="Dark · idle" width={600} height={384}><ConceptC theme="dark" /></DCArtboard>
        <DCArtboard id="c-r" label="Light · recording" width={600} height={384}><ConceptC theme="light" rec /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById("stage")).render(<Board />);
</script>
</body>
</html>
