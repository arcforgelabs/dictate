<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dictate — Wireframe exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#efece6; --bg-2:#e9e5dd; --surface:#fff; --surface-2:#f7f5f1; --surface-3:#f0ede7;
  --fg:#1b1a16; --muted:rgba(27,26,22,.56); --subtle:rgba(27,26,22,.40); --faint:rgba(27,26,22,.22);
  --border:rgba(27,26,22,.10); --border-2:rgba(27,26,22,.16); --hairline:rgba(27,26,22,.07);
  --primary:#1b1a16; --primary-fg:#faf8f4; --primary-hover:#322f29;
  --danger:#c5402c; --danger-bg:rgba(197,64,44,.10); --live:#2f8f63;
  --shadow-sm:0 1px 2px rgba(27,26,22,.05),0 1px 1px rgba(27,26,22,.04);
  --shadow-md:0 2px 4px rgba(27,26,22,.05),0 6px 16px rgba(27,26,22,.07);
  --shadow-lg:0 8px 24px rgba(27,26,22,.10),0 24px 48px rgba(27,26,22,.10);
  --r-xl:24px; --r-lg:18px; --r-md:13px; --r-sm:9px; --r-pill:999px;
  --font-ui:"Hanken Grotesk",system-ui,sans-serif; --font-mono:"JetBrains Mono",ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;font-family:var(--font-ui);color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;}
h2{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:0;}
h3{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0;}
p{margin:0;}
.t-meta{font-size:12.5px;color:var(--muted);}
.t-label{font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
.t-mono{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;}

/* ---------- frame wrapper + annotation ---------- */
.frame{display:flex;flex-direction:column;gap:14px;align-items:flex-start;}
.wf-note{display:flex;gap:9px;align-items:baseline;max-width:560px;font-size:13px;color:var(--muted);line-height:1.45;}
.wf-k{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:20px;height:20px;border-radius:var(--r-pill);
  background:var(--fg);color:var(--bg);font-family:var(--font-mono);font-size:11px;font-weight:600;transform:translateY(3px);}

/* ---------- window chrome ---------- */
.win{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  overflow:hidden;display:flex;flex-direction:column;}
.win-bar{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 14px;
  background:var(--surface-2);border-bottom:1px solid var(--hairline);}
.win-title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;}
.win-mark{width:16px;height:16px;color:var(--fg);display:flex;}
.win-mark svg{width:100%;height:100%;}
.win-sub{color:var(--subtle);font-weight:500;padding-left:9px;margin-left:3px;border-left:1px solid var(--border);}
.win-ctrls{display:flex;gap:2px;}
.win-btn{width:30px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted);}
.win-btn.close:hover{background:var(--danger-bg);color:var(--danger);}
.win-body{flex:1;min-height:0;display:flex;}
.win-foot{flex:0 0 auto;border-top:1px solid var(--hairline);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;}

/* ---------- shared controls ---------- */
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;
  border:1px solid var(--border-2);border-bottom-width:2px;border-radius:7px;background:var(--surface);
  font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--fg);}
.plus{margin:0 4px;color:var(--subtle);font-size:12px;}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r-pill);
  background:var(--surface-2);border:1px solid var(--border);font-family:var(--font-ui);font-size:9.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.chip.live{background:rgba(47,143,99,.12);border-color:rgba(47,143,99,.28);color:var(--live);}
.chip.warn{background:var(--surface-2);color:var(--subtle);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto;display:inline-block;}
.dot.live{background:var(--live);box-shadow:0 0 0 0 rgba(47,143,99,.4);animation:breath 3.8s var(--ease,ease) infinite;}
@keyframes breath{0%,100%{box-shadow:0 0 0 0 rgba(47,143,99,.35);}50%{box-shadow:0 0 0 5px rgba(47,143,99,0);}}
.toggle{display:inline-block;width:38px;height:22px;border-radius:var(--r-pill);background:var(--surface-3);border:1px solid var(--border);
  position:relative;flex:0 0 auto;transition:.2s;vertical-align:middle;}
.toggle .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:.2s;}
.toggle.on{background:var(--fg);border-color:var(--fg);}
.toggle.on .knob{left:18px;}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--surface);font-family:var(--font-ui);font-size:13px;font-weight:600;
  color:var(--fg);cursor:default;white-space:nowrap;}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px;}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg);}
.btn.danger{color:var(--danger);}
.icon-btn{width:34px;height:34px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;
  color:var(--muted);border:1px solid var(--border);background:var(--surface);}
.select{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--border);
  border-radius:8px;background:var(--surface);font-size:13px;font-weight:500;color:var(--fg);}
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px;}
.seg-i{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);}
.seg-i.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm);}
.eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--font-ui);font-size:10.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);}
.eyebrow-n{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--r-pill);padding:1px 7px;}
.wave{display:flex;align-items:center;gap:2px;height:22px;color:var(--live);}
.wave span{width:2.5px;border-radius:2px;display:block;opacity:.85;}

/* row */
.row{display:flex;align-items:center;gap:14px;padding:14px 2px;border-top:1px solid var(--hairline);}
.row.last{} .card.list .row:first-child{border-top:none;}
.row-ic{color:var(--muted);display:flex;}
.row-main{flex:1;min-width:0;}
.row-label{font-size:14px;font-weight:600;}
.row-help{font-size:12.5px;color:var(--muted);margin-top:2px;}
.row-ctrl{flex:0 0 auto;}

/* card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);}
.card.list{padding:6px 16px;}

/* ---------- A · sidebar ---------- */
.layA{display:flex;width:100%;}
.rail{width:218px;flex:0 0 218px;border-right:1px solid var(--hairline);background:var(--surface-2);
  display:flex;flex-direction:column;justify-content:space-between;padding:16px 14px;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);}
.nav-item .svg,.nav-item svg{color:var(--subtle);}
.nav-item.active{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow-sm);}
.nav-item.active svg{color:var(--fg);}
.rail-foot{display:flex;flex-direction:column;gap:8px;}
.pane{flex:1;min-width:0;padding:24px 26px;display:flex;flex-direction:column;gap:18px;overflow:hidden;}
.pane-head{display:flex;align-items:flex-start;justify-content:space-between;}
.pane-head h2{white-space:nowrap;}
.hero-card{display:flex;align-items:center;gap:18px;padding:20px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);}
.hero-mic{width:54px;height:54px;flex:0 0 auto;border-radius:50%;background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--fg);box-shadow:var(--shadow-sm);}
.hero-mic.sm{width:42px;height:42px;}
.hero-line{display:flex;align-items:center;gap:8px;}
.hero-sub{font-size:13px;color:var(--muted);margin-top:5px;max-width:300px;}
.hero-kbd{display:flex;flex-direction:column;align-items:flex-end;text-align:right;}
.two-up{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.card.mini{padding:16px;display:flex;flex-direction:column;gap:7px;}
.mini-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);margin-bottom:2px;}
.mini-label{font-size:12px;color:var(--muted);}
.mini-val{font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;}

/* ---------- B · single scroll ---------- */
.layB{display:flex;flex-direction:column;width:100%;min-height:0;}
.b-status{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--hairline);background:var(--surface-2);}
.b-scroll{flex:1;min-height:0;overflow:hidden;padding:6px 22px 22px;display:flex;flex-direction:column;}
.b-sec{padding:18px 0;border-bottom:1px solid var(--hairline);display:flex;flex-direction:column;gap:12px;}
.b-sec:last-child{border-bottom:none;}
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);}
.opt.sel{border-color:var(--fg);box-shadow:var(--shadow-sm);}
.radio{width:16px;height:16px;border-radius:50%;border:1.75px solid var(--faint);flex:0 0 auto;position:relative;}
.radio.on{border-color:var(--fg);}
.radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--fg);}
.opt-t{font-size:13.5px;font-weight:600;}
.opt-d{font-size:12px;color:var(--muted);margin-top:1px;}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px;}
.word-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r-pill);
  background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:500;color:var(--fg);}
.word-chip svg{color:var(--subtle);}
.word-chip.add{border-style:dashed;color:var(--muted);}

/* ---------- C · springboard ---------- */
.layC{display:flex;flex-direction:column;width:100%;padding:22px;gap:18px;}
.c-head{display:flex;align-items:center;gap:16px;}
.c-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:14px;}
.c-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow-sm);}
.c-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.c-ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--fg);}
.c-card-t{font-size:14px;font-weight:700;letter-spacing:-.01em;}
.c-card-v{font-size:12.5px;color:var(--muted);}
.c-chev{position:absolute;right:14px;bottom:14px;color:var(--faint);}
.c-foot{display:flex;align-items:center;justify-content:space-between;}

/* ---------- HUD ---------- */
.hud-stage{display:flex;flex-direction:column;gap:14px;align-items:center;}
.hud-bg{display:none;}
.hud-cap{display:flex;gap:9px;align-items:baseline;font-size:13px;color:var(--muted);max-width:340px;line-height:1.4;}
.hud-pill{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-pill);
  background:#19191c;color:#f3f1ec;box-shadow:var(--shadow-lg);}
.hud-pill .kbd{background:#26262b;border-color:rgba(255,255,255,.18);color:#f3f1ec;}
.hud-dot{width:9px;height:9px;border-radius:50%;background:#ff6b5b;flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(255,107,91,.5);animation:rec 1.6s ease infinite;}
@keyframes rec{0%,100%{box-shadow:0 0 0 0 rgba(255,107,91,.5);}50%{box-shadow:0 0 0 6px rgba(255,107,91,0);}}
.hud-txt{font-size:13px;font-weight:600;}
.hud-rel{font-size:11.5px;color:rgba(243,241,236,.6);display:flex;align-items:center;gap:5px;}
.hud-chip{display:inline-flex;align-items:center;gap:9px;padding:8px 13px;border-radius:var(--r-pill);
  background:#19191c;color:#f3f1ec;box-shadow:var(--shadow-md);}
.hud-time{color:rgba(243,241,236,.7);}
.hud-orb-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px;}
.hud-orb{width:86px;height:86px;border-radius:50%;background:#19191c;color:#f3f1ec;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-lg),0 0 0 0 rgba(79,189,134,.4);animation:orb 3.8s ease infinite;}
@keyframes orb{0%,100%{box-shadow:var(--shadow-lg),0 0 0 0 rgba(79,189,134,.45);}50%{box-shadow:var(--shadow-lg),0 0 0 16px rgba(79,189,134,0);}}
.hud-orb-txt{font-size:13px;font-weight:600;color:var(--fg);}

/* ---------- onboarding ---------- */
.onb{flex:1;display:flex;flex-direction:column;padding:26px 28px;}
.onb-dots{display:flex;gap:6px;margin-bottom:20px;}
.onb-d{width:24px;height:4px;border-radius:2px;background:var(--surface-3);}
.onb-d.done{background:var(--faint);}
.onb-d.now{background:var(--fg);}
.onb-mark{width:34px;height:34px;color:var(--fg);margin-bottom:14px;}
.onb-mark svg{width:100%;height:100%;}
.onb-body{flex:1;display:flex;flex-direction:column;gap:14px;margin-top:14px;}
.onb-lede{font-size:13.5px;color:var(--muted);line-height:1.5;}
.onb-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
.field{display:flex;flex-direction:column;gap:7px;}
.input{display:flex;align-items:center;justify-content:space-between;height:42px;padding:0 14px;border:1px solid var(--border-2);
  border-radius:var(--r-md);background:var(--surface);}
.onb-help{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);}
.capture{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px;border:1.5px dashed var(--border-2);
  border-radius:var(--r-md);background:var(--surface-2);}
.capture-keys{display:flex;align-items:center;}

/* ---------- recent history ---------- */
.hist{flex:1;display:flex;flex-direction:column;}
.hist-head{padding:20px 22px 14px;}
.hist-list{flex:1;padding:0 14px;display:flex;flex-direction:column;}
.hist-item{display:flex;align-items:flex-start;gap:13px;padding:15px 8px;border-top:1px solid var(--hairline);}
.hist-item:first-child{border-top:none;}
.hist-i{width:20px;height:20px;flex:0 0 auto;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--muted);margin-top:2px;}
.hist-main{flex:1;min-width:0;}
.hist-time{font-size:11px;color:var(--subtle);font-family:var(--font-mono);letter-spacing:.02em;}
.hist-text{font-size:13.5px;line-height:1.45;margin-top:3px;color:var(--fg);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hist-foot{border-top:1px solid var(--hairline);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;}

/* ---------- tray ---------- */
.tray-stage{display:flex;flex-direction:column;align-items:center;gap:14px;}
.tray-bar{width:200px;height:32px;border-radius:8px;background:var(--surface-3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:flex-end;padding:0 10px;}
.tray-ic{width:16px;height:16px;color:var(--fg);}
.tray-ic svg{width:100%;height:100%;}
.tray-menu{width:248px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  box-shadow:var(--shadow-lg);padding:6px;}
.tray-head{display:flex;align-items:center;gap:8px;padding:9px 10px 10px;font-size:12.5px;font-weight:600;}
.tray-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--fg);}
.tray-row svg{color:var(--muted);}
.tray-row:hover{background:var(--surface-2);}
.tray-row.danger{color:var(--danger);}
.tray-row.danger svg{color:var(--danger);}
.tray-k{margin-left:auto;display:flex;align-items:center;}
.tray-check{width:16px;display:flex;color:var(--live);}
.tray-check svg{color:var(--live);}
.tray-div{height:1px;background:var(--hairline);margin:5px 8px;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="kit.jsx"></script>
<script type="text/babel" src="settings.jsx"></script>
<script type="text/babel" src="surfaces.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App(){
  return (
    <DesignCanvas title="Dictate — Wireframes" subtitle="Quiet Console · mid-fi exploration">
      <DCSection id="settings" title="Settings window — three directions"
        subtitle="A proper desktop window. Same content, three information architectures.">
        <DCArtboard id="a" label="A · Sidebar console" width={920} height={720}><DirA/></DCArtboard>
        <DCArtboard id="b" label="B · Single calm scroll" width={620} height={720}><DirB/></DCArtboard>
        <DCArtboard id="c" label="C · Springboard cards" width={760} height={720}><DirC/></DCArtboard>
      </DCSection>

      <DCSection id="hud" title="Listening HUD" subtitle="The overlay shown while you hold to talk.">
        <DCArtboard id="h1" label="1 · Anchored pill" width={420} height={170}><HudPill/></DCArtboard>
        <DCArtboard id="h2" label="2 · Corner chip" width={320} height={170}><HudChip/></DCArtboard>
        <DCArtboard id="h3" label="3 · Centered orb" width={320} height={210}><HudOrb/></DCArtboard>
      </DCSection>

      <DCSection id="onb" title="First-run onboarding" subtitle="Model → key → shortcut. Always skippable.">
        <DCArtboard id="o1" label="Step 1 · Model" width={440} height={560}><OnbModel/></DCArtboard>
        <DCArtboard id="o2" label="Step 2 · API key" width={440} height={560}><OnbKey/></DCArtboard>
        <DCArtboard id="o3" label="Step 3 · Push-to-talk" width={440} height={560}><OnbPtt/></DCArtboard>
      </DCSection>

      <DCSection id="recovery" title="Recovery & entry points" subtitle="Recent history dialog and the tray menu.">
        <DCArtboard id="hist" label="Recent history" width={460} height={500}><HistoryPanel/></DCArtboard>
        <DCArtboard id="tray" label="Tray menu" width={300} height={420}><TrayMenu/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
