<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="preview.css" />
</head>
<body class="card-pad">
<div class="sw-grid" style="grid-template-columns:repeat(5,1fr)">
  <div class="sw"><div class="chiparea" style="background:var(--bg)"></div><div class="m"><div class="nm">Paper</div><div class="vr">#0a0a0b</div></div></div>
  <div class="sw"><div class="chiparea" style="background:var(--surface)"></div><div class="m"><div class="nm">Surface</div><div class="vr">#19191c</div></div></div>
  <div class="sw"><div class="chiparea" style="background:var(--surface-2)"></div><div class="m"><div class="nm">Raised</div><div class="vr">#212126</div></div></div>
  <div class="sw"><div class="chiparea" style="background:var(--surface-3)"></div><div class="m"><div class="nm">Inset</div><div class="vr">#2c2c33</div></div></div>
  <div class="sw"><div class="chiparea" style="background:var(--live)"></div><div class="m"><div class="nm">Live</div><div class="vr">#4fbd86</div></div></div>
</div>
</body>
</html>
