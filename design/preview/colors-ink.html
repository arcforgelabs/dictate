<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="preview.css" />
</head>
<body class="card-pad">
<div class="sw-grid" style="grid-template-columns:repeat(4,1fr)">
  <div class="sw"><div class="chiparea" style="background:var(--fg)"></div><div class="m"><div class="nm">Ink</div><div class="vr">--fg</div></div></div>
  <div class="sw"><div class="chiparea" style="background:var(--muted)"></div><div class="m"><div class="nm">Muted</div><div class="vr">--muted · .56</div></div></div>
  <div class="sw"><div class="chiparea" style="background:var(--subtle)"></div><div class="m"><div class="nm">Subtle</div><div class="vr">--subtle · .40</div></div></div>
  <div class="sw"><div class="chiparea" style="background:var(--faint)"></div><div class="m"><div class="nm">Faint</div><div class="vr">--faint · .22</div></div></div>
</div>
</body>
</html>
