<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="preview.css" />
</head>
<body class="card-pad" style="background:var(--surface-2)">
<div class="col-flex" style="gap:14px">
  <div style="display:flex;align-items:center;gap:16px">
    <div class="t-mono" style="flex:0 0 130px">--border <span class="muted">.10</span></div>
    <div style="flex:1;height:40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)"></div>
  </div>
  <div style="display:flex;align-items:center;gap:16px">
    <div class="t-mono" style="flex:0 0 130px">--border-2 <span class="muted">.16</span></div>
    <div style="flex:1;height:40px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-md)"></div>
  </div>
  <div style="display:flex;align-items:center;gap:16px">
    <div class="t-mono" style="flex:0 0 130px">--hairline <span class="muted">.07</span></div>
    <div style="flex:1;height:40px;background:var(--surface);border-radius:var(--r-md);display:flex;align-items:center">
      <div style="width:100%;border-top:1px solid var(--hairline)"></div>
    </div>
  </div>
</div>
</body>
</html>
