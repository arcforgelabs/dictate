<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="preview.css" />
</head>
<body class="card-pad">
<div class="sw-grid" style="grid-template-columns:repeat(4,1fr)">
  <div class="sw"><div class="chiparea" style="background:var(--primary)"></div><div class="m"><div class="nm">Primary</div><div class="vr">--primary · #1b1a16</div></div></div>
  <div class="sw"><div class="chiparea" style="background:var(--live)"></div><div class="m"><div class="nm">Live <span style="color:var(--live)">●</span></div><div class="vr">--live · #2f8f63</div></div></div>
  <div class="sw"><div class="chiparea" style="background:var(--danger)"></div><div class="m"><div class="nm">Danger</div><div class="vr">--danger · #c5402c</div></div></div>
  <div class="sw"><div class="chiparea" style="background:var(--amber)"></div><div class="m"><div class="nm">Amber</div><div class="vr">--amber · #c08a2d</div></div></div>
</div>
</body>
</html>
