<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="preview.css" />
</head>
<body class="card-pad">
<div class="row-flex" style="gap:26px">
  <div class="col-flex" style="gap:10px;align-items:flex-start">
    <span class="t-label">Toggle</span>
    <div class="row-flex" style="gap:12px">
      <span class="toggle on"><span class="knob"></span></span>
      <span class="toggle"><span class="knob"></span></span>
    </div>
  </div>
  <div class="col-flex" style="gap:10px;align-items:flex-start">
    <span class="t-label">Segmented</span>
    <div class="seg"><button class="on">Light</button><button>Dark</button></div>
  </div>
  <div class="col-flex" style="gap:10px;align-items:flex-start">
    <span class="t-label">Select</span>
    <button class="select">Built-in microphone
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
</div>
</body>
</html>
