<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="preview.css" />
</head>
<body class="card-pad">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
  <div>
    <div style="font-size:46px;letter-spacing:-.02em;line-height:1;font-family:var(--font-ui);font-weight:800">Aa</div>
    <div style="font-size:17px;color:var(--muted);margin-top:14px;letter-spacing:.02em">Hh Gg Rr 0123 — listen, type</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--hairline)">
      <span style="font-size:14px;font-weight:700">Hanken Grotesk</span>
      <span style="font-size:11.5px;color:var(--muted)">400 · 500 · 600 · 700 · 800</span>
    </div>
  </div>
  <div>
    <div style="font-size:46px;letter-spacing:-.02em;line-height:1;font-family:var(--font-mono);font-weight:600">Aa</div>
    <div style="font-size:17px;color:var(--muted);margin-top:14px;font-family:var(--font-mono)">Ctrl+R · int8 · 0:03</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--hairline)">
      <span style="font-size:14px;font-weight:700">JetBrains Mono</span>
      <span style="font-size:11.5px;color:var(--muted)">400 · 500 · 600</span>
    </div>
  </div>
</div>
</body>
</html>
