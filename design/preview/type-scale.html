<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="preview.css" />
<style>
  .trow{display:flex;align-items:baseline;gap:20px;padding:12px 0;border-top:1px solid var(--hairline);}
  .trow:first-child{border-top:none;}
  .trow .spec{flex:1;min-width:0;}
  .trow .info{flex:0 0 190px;text-align:right;}
  .trow .info .rl{font-size:12.5px;font-weight:600;}
  .trow .info .dt{font-family:var(--font-mono);font-size:10px;color:var(--subtle);margin-left:10px;}
</style>
</head>
<body class="card-pad">
  <div class="trow"><div class="spec t-display">Ready to dictate</div><div class="info"><span class="rl">Display</span><span class="dt">30 / 800 / -3%</span></div></div>
  <div class="trow"><div class="spec t-title">Transcription model</div><div class="info"><span class="rl">Title</span><span class="dt">23 / 800 / -2%</span></div></div>
  <div class="trow"><div class="spec t-heading">Local compute</div><div class="info"><span class="rl">Heading</span><span class="dt">17 / 700 / -1%</span></div></div>
  <div class="trow"><div class="spec t-body">Hold your shortcut, speak, release.</div><div class="info"><span class="rl">Body</span><span class="dt">14.5 / 400</span></div></div>
  <div class="trow"><div class="spec t-meta">microphone connected</div><div class="info"><span class="rl">Meta</span><span class="dt">12.5 · muted</span></div></div>
  <div class="trow"><div class="spec t-label">PUSH-TO-TALK</div><div class="info"><span class="rl">Label</span><span class="dt">10.5 / 700 caps</span></div></div>
  <div class="trow"><div class="spec t-mono" style="font-size:14px">faster-whisper · int8</div><div class="info"><span class="rl">Mono</span><span class="dt">JetBrains 500</span></div></div>
</body>
</html>
