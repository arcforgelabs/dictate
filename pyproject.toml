[project]
name = "dictate"
version = "2026.7.4"
description = "Desktop dictation that types into the focused app."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "faster-whisper>=1.1.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0.0",
    "sounddevice>=0.5.0",
    # AGC + noise suppression (WebRTC APM) on the capture stream. Linux-only wheels;
    # the code degrades to raw capture where it is unavailable.
    "webrtc-noise-gain>=1.3.0; sys_platform == 'linux'",
    # NVIDIA Parakeet English backend (ONNX, CPU-friendly). onnxruntime is pinned
    # below 1.24 to avoid the external-data path check that rejects the model.
    "onnx-asr>=0.11.0",
    "onnxruntime>=1.19,<1.24",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu[cuda,cudnn]>=1.23,<1.24; (platform_machine == 'x86_64' or platform_machine == 'AMD64') and (sys_platform == 'linux' or sys_platform == 'win32')",
]
amd = [
    "onnxruntime-directml>=1.19,<1.24; (platform_machine == 'x86_64' or platform_machine == 'AMD64') and sys_platform == 'win32'",
]
whisperx = ["whisperx>=3.8.6"]
meeting = ["pyannote.audio>=4.0.0", "torch>=2.4.0"]
sortformer = [
    "nemo-toolkit[asr]>=2.6,<2.7",
    # NeMo 2.6's ASR imports require the pre-0.22 tokenizer API.
    "tokenizers>=0.21,<0.22",
    "transformers>=4.53,<4.54",
]
x11 = ["pynput>=1.7.0"]
wayland = ["evdev>=1.9.0"]
windows = ["pynput>=1.7.0", "pyperclip>=1.9.0"]
# Brand-icon generation + the icon regression guard (tests/test_brand_icon.py).
dev = ["pillow>=12.3.0", "cairosvg>=2.7"]

[project.scripts]
dictate = "dictate.__main__:main_with_logging"
dictate-ui-server = "dictate.ui_server:main"

[project.gui-scripts]
dictate-controls = "dictate.windows_control:run_control_panel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictate"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.worktrees",
    "/dist",
    "/packaging/.build-venv",
    "/packaging/build",
    "/packaging/dist",
    "/ui/dist",
    "/ui/node_modules",
    "/ui-shell/node_modules",
    "/ui-shell/src-tauri/engine",
    "/ui-shell/src-tauri/gen",
    "/ui-shell/src-tauri/target",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
