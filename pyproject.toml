[project]
name = "dictate"
version = "2026.6.22"
description = "Desktop dictation that types into the focused app."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "faster-whisper>=1.1.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0.0",
    "sounddevice>=0.5.0",
]

[project.optional-dependencies]
gpu = ["torch>=2.4.0"]
nemo = ["nemo_toolkit[asr]>=2.4.0"]
x11 = ["pynput>=1.7.0"]
wayland = ["evdev>=1.9.0"]
windows = ["pynput>=1.7.0", "pyperclip>=1.9.0"]

[project.scripts]
dictate = "dictate.__main__:main_with_logging"
dictate-ui-server = "dictate.ui_server:main"

[project.gui-scripts]
dictate-controls = "dictate.windows_control:run_control_panel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictate"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.worktrees",
    "/dist",
    "/packaging/.build-venv",
    "/packaging/build",
    "/packaging/dist",
    "/ui/dist",
    "/ui/node_modules",
    "/ui-shell/node_modules",
    "/ui-shell/src-tauri/engine",
    "/ui-shell/src-tauri/gen",
    "/ui-shell/src-tauri/target",
]

[tool.ruff]
target-version = "py311"
line-length = 100
