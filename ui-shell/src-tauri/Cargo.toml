[package]
name = "dictate-ui-shell"
version = "2026.6.23"
description = "Dictate — Quiet Console shell (Tauri 2)"
authors = ["Arc Forge Labs"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dictate_ui_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
